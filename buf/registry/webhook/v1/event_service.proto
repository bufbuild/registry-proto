syntax = "proto3";

package buf.registry.webhook.v1;

import "buf/registry/webhook/v1/event.proto";
import "buf/validate/validate.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/webhook/v1";

// EventService is implemented by receivers of Webhook Events.
//
// This service is not hosted by the BSR; it is the contract that a Webhook's receiving
// endpoint implements. The BSR delivers an Event by invoking Event on the receiver.
//
// Delivery is at-least-once: a delivery may be retried, and every delivery of the same
// Event occurrence carries the same id, which receivers can use to deduplicate.
service EventService {
  // Event delivers a single Event to the receiver.
  rpc Event(EventRequest) returns (EventResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message EventRequest {
  // The Event being delivered.
  Event event = 1 [(buf.validate.field).required = true];
}

message EventResponse {}
