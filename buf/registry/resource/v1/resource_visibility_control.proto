syntax = "proto3";

package buf.registry.resource.v1;

import "buf/registry/priv/extension/v1beta1/extension.proto";
import "buf/validate/validate.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/resource/v1";

// The visibility of a resource, currently either public or private.
//
// This is the control-layer visibility enum used by ResourceVisibilityControl. It is intentionally
// distinct from the per-resource ModuleVisibility, PluginVisibility, and PolicyVisibility enums
// that remain on those resources.
enum ResourceVisibility {
  RESOURCE_VISIBILITY_UNSPECIFIED = 0;
  // The resource is publicly available.
  RESOURCE_VISIBILITY_PUBLIC = 1;
  // The resource is private.
  RESOURCE_VISIBILITY_PRIVATE = 2;
}

// A control over the visibility of a type of resource, set at the instance or Organization
// scope via the ResourceVisibilityControlService.
//
// The type of resource a control governs is implied by the field it occupies, for
// example the module_visibility_control field governs Modules.
message ResourceVisibilityControl {
  // The visibility assigned to resources of the governed type.
  ResourceVisibility resource_visibility = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
  // Whether resource_visibility is enforced or is a fallback default.
  //
  // If strict, resources of the governed type must use resource_visibility and a lower layer
  // cannot override it; only an administrator at the control's layer may deviate. If not strict,
  // resource_visibility is used when no explicit visibility is given when a resource is created or
  // updated, but it may be overridden.
  bool strict = 2;
}

// The visibility controls for each type of controlled resource at a single scope.
//
// Controls at different scopes form layers: an Organization-scope control is ignored when
// a strict instance-scope control is set for the same type of resource.
message ResourceVisibilityControls {
  option (buf.registry.priv.extension.v1beta1.message).response_only = true;

  // The visibility control for Modules.
  //
  // If unset, new Modules fall through to the control at the next scope, and default to
  // private if no control applies at any scope.
  ResourceVisibilityControl module_visibility_control = 1;
  // The visibility control for Plugins.
  //
  // If unset, new Plugins fall through to the control at the next scope, and default to
  // private if no control applies at any scope.
  ResourceVisibilityControl plugin_visibility_control = 2;
  // The visibility control for Policies.
  //
  // If unset, new Policies fall through to the control at the next scope, and default to
  // private if no control applies at any scope.
  ResourceVisibilityControl policy_visibility_control = 3;
}
