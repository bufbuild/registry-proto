syntax = "proto3";

package buf.registry.iam.v1;

import "buf/registry/iam/v1/role.proto";
import "buf/registry/iam/v1/scope.proto";
import "buf/registry/owner/v1/owner.proto";
import "buf/registry/priv/extension/v1beta1/extension.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/iam/v1";

// A RoleBinding on the BSR.
//
// A RoleBinding grants a Role to a RoleBindingSubject with a Scope.
//
// A RoleBinding is uniquely identified by its subject, Role, and scope.
//
// RoleBindings are immutable once created. To change a grant, delete the RoleBinding and create a
// new one.
message RoleBinding {
  option (buf.registry.priv.extension.v1beta1.message).response_only = true;

  // The id of the RoleBinding.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.tuuid = true
  ];
  // The time the RoleBinding was created.
  google.protobuf.Timestamp create_time = 2 [(buf.validate.field).required = true];
  // The subject that the Role is granted to.
  RoleBindingSubject subject = 3 [(buf.validate.field).required = true];
  // The id of the Role that is granted.
  string role_id = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.tuuid = true
  ];
  // The scope of the RoleBinding.
  Scope scope = 5 [(buf.validate.field).required = true];
}

// The subject of a RoleBinding.
message RoleBindingSubject {
  option (buf.registry.priv.extension.v1beta1.message).response_only = true;

  oneof value {
    option (buf.validate.oneof).required = true;
    // The id of the User that the Role is granted to.
    string user_id = 1 [(buf.validate.field).string.tuuid = true];
    // The id of the Organization that the Role is granted to.
    //
    // Organization members inherit the permissions of the Organization's Roles.
    string organization_id = 2 [(buf.validate.field).string.tuuid = true];
  }
}

// RoleBindingRef is a reference to a RoleBinding, either by its id or by the subject, Role, and
// scope that uniquely identify it.
//
// This is used in requests.
message RoleBindingRef {
  option (buf.registry.priv.extension.v1beta1.message).request_only = true;

  // The subject, Role, and scope that together uniquely identify a RoleBinding.
  message SubjectRoleScope {
    // The subject that the Role is granted to.
    buf.registry.owner.v1.OwnerRef subject_ref = 1 [(buf.validate.field).required = true];
    // The Role that is granted.
    RoleRef role_ref = 2 [(buf.validate.field).required = true];
    // The scope that the Role is granted for.
    Scope scope = 3 [(buf.validate.field).required = true];
  }
  oneof value {
    option (buf.validate.oneof).required = true;
    // The id of the RoleBinding.
    string id = 1 [(buf.validate.field).string.tuuid = true];
    // The subject, Role, and scope that uniquely identify the RoleBinding.
    SubjectRoleScope subject_role_scope = 2;
  }
}
