syntax = "proto3";

package buf.registry.audit.v1;

import "buf/registry/priv/extension/v1beta1/extension.proto";
import "buf/validate/validate.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/audit/v1";

// Actor is a point-in-time snapshot of the principal that performed an audited action.
//
// An Actor is denormalized and immutable: it records the principal's identity as it was at
// the time of the event, and remains populated even if the principal is later renamed or
// deleted. It is never resolved against live identity state.
message Actor {
  option (buf.registry.priv.extension.v1beta1.message).response_only = true;

  // The type of the Actor.
  ActorType type = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  // The id of the Actor at the time of the event.
  //
  // It is empty for ACTOR_TYPE_SYSTEM, which records its subsystem label in name instead.
  string id = 2 [
    (buf.validate.field).string.tuuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // The name of the Actor at the time of the event.
  //
  // For ACTOR_TYPE_SYSTEM, this is a stable identifier for the subsystem that performed the
  // action.
  string name = 3 [(buf.validate.field).string.max_len = 255];
}

// ActorType is the type of principal that performed an audited action.
enum ActorType {
  ACTOR_TYPE_UNSPECIFIED = 0;
  // The Actor was a human User.
  ACTOR_TYPE_USER = 1;
  // The Actor was a system-initiated action.
  ACTOR_TYPE_SYSTEM = 2;
}
