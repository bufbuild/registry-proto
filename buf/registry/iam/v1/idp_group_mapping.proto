syntax = "proto3";

package buf.registry.iam.v1;

import "buf/registry/module/v1/module.proto";
import "buf/registry/module/v1/module_contributor.proto";
import "buf/registry/owner/v1/organization.proto";
import "buf/registry/owner/v1/organization_membership.proto";
import "buf/registry/priv/extension/v1beta1/extension.proto";
import "buf/registry/priv/validate/v1beta1/validate.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/iam/v1";

// An IdP group mapping on an Organization.
//
// A mapping grants a role within the Organization to all Users who are members of an identity
// provider group: a mapped User receives the role when they log in. Group membership is
// provisioned by the identity provider, not managed through this API.
//
// A mapping is uniquely identified by its Organization and IdP group name.
message OrganizationIdpGroupMapping {
  option (buf.registry.priv.extension.v1beta1.message).response_only = true;

  // The id of the Organization that the mapping applies to.
  string organization_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.tuuid = true
  ];
  // The name of the IdP group, as it appears in the identity provider.
  string group_name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(buf.registry.priv.validate.v1beta1.idp_group_name) = true
  ];
  // The time the mapping was created.
  google.protobuf.Timestamp create_time = 3 [(buf.validate.field).required = true];
  // The last time the mapping was updated.
  google.protobuf.Timestamp update_time = 4 [(buf.validate.field).required = true];
  // The role override.
  //
  // If set, mapped Users receive this role within the Organization. If unset, mapped Users
  // receive ORGANIZATION_ROLE_MEMBER, the role an Organization mapping grants by default.
  optional buf.registry.owner.v1.OrganizationRole role_override = 5 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
}

// An IdP group mapping on a Module.
//
// A mapping grants a role on the Module to all Users who are members of an identity provider
// group: a mapped User receives the role when they log in. Group membership is provisioned by the
// identity provider, not managed through this API.
//
// A mapping is uniquely identified by its Module and IdP group name.
message ModuleIdpGroupMapping {
  option (buf.registry.priv.extension.v1beta1.message).response_only = true;

  // The id of the Module that the mapping applies to.
  string module_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.tuuid = true
  ];
  // The name of the IdP group, as it appears in the identity provider.
  string group_name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(buf.registry.priv.validate.v1beta1.idp_group_name) = true
  ];
  // The time the mapping was created.
  google.protobuf.Timestamp create_time = 3 [(buf.validate.field).required = true];
  // The last time the mapping was updated.
  google.protobuf.Timestamp update_time = 4 [(buf.validate.field).required = true];
  // The role that mapped Users receive when no override is set.
  //
  // This is the base Module role of the Organization that owns the Module, as configured in its
  // OrganizationSettings.
  buf.registry.module.v1.ModuleContributorRole default_role = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
  // The role override.
  //
  // If set, mapped Users receive this role on the Module instead of default_role. If unset,
  // mapped Users receive default_role.
  optional buf.registry.module.v1.ModuleContributorRole role_override = 6 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
}

// An IdP group mapping on any resource.
message IdpGroupMapping {
  option (buf.registry.priv.extension.v1beta1.message).response_only = true;

  oneof value {
    option (buf.validate.oneof).required = true;
    // A mapping on an Organization.
    OrganizationIdpGroupMapping organization = 1;
    // A mapping on a Module.
    ModuleIdpGroupMapping module = 2;
  }
}

// IdpGroupMappingRef is a reference to an IdpGroupMapping, which is uniquely identified by its
// resource and IdP group name.
//
// This is used in requests.
message IdpGroupMappingRef {
  option (buf.registry.priv.extension.v1beta1.message).request_only = true;

  // The name of the IdP group.
  string group_name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(buf.registry.priv.validate.v1beta1.idp_group_name) = true
  ];
  oneof value {
    option (buf.validate.oneof).required = true;
    // The Organization that the mapping applies to.
    buf.registry.owner.v1.OrganizationRef organization_ref = 2;
    // The Module that the mapping applies to.
    buf.registry.module.v1.ModuleRef module_ref = 3;
  }
}
