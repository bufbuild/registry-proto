syntax = "proto3";

package buf.registry.module.v1;

import "buf/registry/owner/v1/user.proto";
import "buf/registry/priv/extension/v1beta1/extension.proto";
import "buf/validate/validate.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/module/v1";

// A Contributor is a User that has been granted an explicit ResourceRole on a Module.
//
// Contributors model per-Module access. A User may also have access to a Module without
// being a Contributor, by inheriting a role from the Organization that owns the Module. The
// effective access of a User on a Module is the greater of its explicit_role (as a
// Contributor) and its implicit_role (inherited from the owning Organization).
//
// Only Modules owned by an Organization can have Contributors.
message Contributor {
  option (buf.registry.priv.extension.v1beta1.message).response_only = true;

  // The User that holds the role on the Module.
  buf.registry.owner.v1.User user = 1 [(buf.validate.field).required = true];
  // The id of the Module the role applies to.
  string module_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.tuuid = true
  ];
  // The role explicitly granted to the User on the Module.
  //
  // This is the role assigned directly on the Module, independent of any role the User
  // inherits from the owning Organization. A Contributor always has an explicit role, so
  // this is never RESOURCE_ROLE_UNSPECIFIED.
  ResourceRole explicit_role = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
  // The role the User inherits from membership in the owning Organization.
  //
  // If the User is not a member of the owning Organization, this is
  // RESOURCE_ROLE_UNSPECIFIED.
  ResourceRole implicit_role = 4 [(buf.validate.field).enum.defined_only = true];
  // The source of the explicit role, which determines whether it can be modified via the
  // ContributorService.
  ResourceRoleSource explicit_role_source = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
}

// ResourceRole is the role a User has on a resource, such as a Module.
//
// Roles are ordered by increasing privilege. Each role includes all the capabilities of the
// roles below it.
enum ResourceRole {
  RESOURCE_ROLE_UNSPECIFIED = 0;
  // Pull and view the resource and its contents.
  RESOURCE_ROLE_READ = 1;
  // RESOURCE_ROLE_READ, plus push new Commits. Does not allow managing Labels.
  RESOURCE_ROLE_LIMITED_WRITE = 2;
  // RESOURCE_ROLE_LIMITED_WRITE, plus create and move Labels.
  RESOURCE_ROLE_WRITE = 3;
  // RESOURCE_ROLE_WRITE, plus manage the resource's settings and Contributors.
  RESOURCE_ROLE_ADMIN = 4;
}

// ResourceRoleSource indicates how a ResourceRole was granted to a User.
enum ResourceRoleSource {
  RESOURCE_ROLE_SOURCE_UNSPECIFIED = 0;
  // The role was granted directly via the ContributorService.
  //
  // This is the only source that can be created, updated, or deleted through the
  // ContributorService.
  RESOURCE_ROLE_SOURCE_DIRECT = 1;
  // The role was granted by a mapping from an external identity provider group.
  //
  // Roles from this source are managed at the identity provider and are read-only here.
  RESOURCE_ROLE_SOURCE_IDP_GROUP = 2;
  // The role was granted by instance or Organization configuration.
  //
  // Roles from this source are managed by configuration and are read-only here.
  RESOURCE_ROLE_SOURCE_CONFIG = 3;
}
