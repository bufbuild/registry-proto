syntax = "proto3";

package buf.registry.audit.v1;

import "buf/registry/audit/v1/event.proto";
import "buf/registry/priv/extension/v1beta1/extension.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/audit/v1";

// AuditService is the Audit service.
service AuditService {
  // ListEvents lists audited events recorded in the BSR instance.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (buf.registry.priv.extension.v1beta1.method).required_permission = "bsr.audit.list";
  }
}

message ListEventsRequest {
  // The list order.
  enum Order {
    ORDER_UNSPECIFIED = 0;
    // Order by event_time earliest to latest.
    //
    // Events recorded at the same time are ordered by their id.
    ORDER_EVENT_TIME_ASC = 1;
  }

  // The maximum number of items to return.
  //
  // The default value is 10.
  uint32 page_size = 1 [(buf.validate.field).uint32.lte = 250];
  // The page to start from.
  //
  // If empty, the first page is returned.
  string page_token = 2 [(buf.validate.field).string.max_len = 4096];
  // Only return Events at or after this time, inclusive.
  //
  // If not set, there is no lower bound.
  google.protobuf.Timestamp start_time = 3;
  // Only return Events at or before this time, inclusive.
  //
  // If not set, there is no upper bound.
  google.protobuf.Timestamp end_time = 4;
  // The order to return the Events.
  //
  // If not specified, defaults to ORDER_EVENT_TIME_ASC.
  Order order = 5 [(buf.validate.field).enum.defined_only = true];

  option (buf.validate.message).cel = {
    id: "list_events_request.time_range"
    message: "end_time must not be before start_time"
    expression: "!has(this.start_time) || !has(this.end_time) || this.start_time <= this.end_time"
  };
}

message ListEventsResponse {
  // The next page token.
  //
  // If empty, there are no more pages.
  string next_page_token = 1 [(buf.validate.field).string.max_len = 4096];
  // The listed Events.
  repeated Event events = 2;
}
