syntax = "proto3";

package buf.registry.owner.v1;

import "buf/registry/owner/v1/organization.proto";
import "buf/registry/owner/v1/user.proto";
import "buf/registry/priv/extension/v1beta1/extension.proto";
import "buf/registry/priv/validate/v1beta1/validate.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/owner/v1";

// The membership of a User in an Organization.
//
// An OrganizationMembership is a view of a RoleBinding whose subject is the User and whose
// scope is the Organization: the User is a member of the Organization, holding the named
// Role on it. A User has at most one OrganizationMembership per Organization.
message OrganizationMembership {
  option (buf.registry.priv.extension.v1beta1.message).response_only = true;

  // The id of the Organization that the User is a member of.
  string organization_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.tuuid = true
  ];
  // The id of the User that is a member of the Organization.
  string user_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.tuuid = true
  ];
  // The time the User became a member of the Organization.
  //
  // This time is preserved when the membership Role is updated.
  google.protobuf.Timestamp create_time = 3 [(buf.validate.field).required = true];
  // The name of the Role that the User holds on the Organization.
  //
  // A Role name uniquely identifies a Role within the BSR instance.
  string role_name = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(buf.registry.priv.validate.v1beta1.role_name) = true
  ];
}

// OrganizationMembershipRef is a reference to an OrganizationMembership, by the Organization
// and the User that uniquely identify it.
//
// This is used in requests.
message OrganizationMembershipRef {
  option (buf.registry.priv.extension.v1beta1.message).request_only = true;

  // The Organization that the User is a member of.
  OrganizationRef organization_ref = 1 [(buf.validate.field).required = true];
  // The User that is a member of the Organization.
  UserRef user_ref = 2 [(buf.validate.field).required = true];
}
