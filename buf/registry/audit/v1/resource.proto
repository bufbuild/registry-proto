syntax = "proto3";

package buf.registry.audit.v1;

import "buf/registry/priv/extension/v1beta1/extension.proto";
import "buf/validate/validate.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/audit/v1";

// Resource is a point-in-time snapshot of the resource an audited action was performed on.
//
// Like Actor, a Resource is denormalized and immutable: it records the resource as it was at
// the time of the event and remains populated even if the resource is later renamed or
// deleted.
message Resource {
  option (buf.registry.priv.extension.v1beta1.message).response_only = true;

  // The type of the Resource.
  ResourceType type = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  // The id of the affected Resource at the time of the event.
  //
  // May be empty for instance-level resources that have no id (for example, the server).
  string id = 2 [
    (buf.validate.field).string.tuuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // The name of the affected Resource at the time of the event.
  string name = 3 [(buf.validate.field).string.max_len = 255];
  // The id of the User or Organization that owned the Resource at the time of the event.
  //
  // This is populated for owned resources (Modules, Plugins, Policies and their children,
  // Organization members, and so on) and enables owner-scoped audit queries. It is empty for
  // instance-level resources such as the server.
  string owner_id = 4 [
    (buf.validate.field).string.tuuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

// ResourceType is the type of resource affected by an audited action.
enum ResourceType {
  RESOURCE_TYPE_UNSPECIFIED = 0;
  RESOURCE_TYPE_USER = 1;
  RESOURCE_TYPE_ORGANIZATION = 2;
  RESOURCE_TYPE_ORGANIZATION_MEMBER = 3;
  RESOURCE_TYPE_ORGANIZATION_IDP_GROUP = 9;
  RESOURCE_TYPE_REPOSITORY = 4;
  RESOURCE_TYPE_REPOSITORY_CONTRIBUTOR = 5;
  RESOURCE_TYPE_REPOSITORY_COMMIT = 6;
  RESOURCE_TYPE_REPOSITORY_IDP_GROUP = 18;
  RESOURCE_TYPE_POLICY = 17;
  RESOURCE_TYPE_POLICY_COMMIT = 19;
  RESOURCE_TYPE_POLICY_LABEL = 20;
  RESOURCE_TYPE_POLICY_ENFORCEMENT = 22;
  RESOURCE_TYPE_PLUGIN = 7;
  RESOURCE_TYPE_PLUGIN_COMMIT = 15;
  RESOURCE_TYPE_CURATED_PLUGIN = 8;
  RESOURCE_TYPE_TOKEN = 10;
  RESOURCE_TYPE_SCIM_TOKEN = 11;
  RESOURCE_TYPE_REPOSITORY_LABEL = 12;
  RESOURCE_TYPE_SERVER = 13;
  RESOURCE_TYPE_DEVICE_AUTHORIZATION_GRANT = 14;
  RESOURCE_TYPE_PLUGIN_LABEL = 16;
  RESOURCE_TYPE_SDK_PLUGIN_CONSTRAINT = 21;
  RESOURCE_TYPE_AUTHORIZATION_REQUEST = 23;
}
