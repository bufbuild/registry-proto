syntax = "proto3";

package buf.registry.webhook.v1;

import "buf/registry/priv/extension/v1beta1/extension.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/webhook/v1";

// A Webhook on the BSR.
//
// A Webhook subscribes to Events within a scope, either an Owner or a single Module, and
// delivers them to a URL. The scope of a Webhook is immutable once created.
message Webhook {
  option (buf.registry.priv.extension.v1beta1.message).response_only = true;

  // The state of a Webhook.
  enum State {
    STATE_UNSPECIFIED = 0;
    // The Webhook is enabled and Events are delivered to it.
    STATE_ENABLED = 1;
    // The Webhook is disabled and no Events are delivered to it.
    //
    // A Webhook may be disabled via UpdateWebhooks, or by the server after persistent
    // delivery failure.
    STATE_DISABLED = 2;
  }
  // The id of the Webhook.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.tuuid = true
  ];
  // The time the Webhook was created.
  google.protobuf.Timestamp create_time = 2 [(buf.validate.field).required = true];
  // The last time the Webhook was updated.
  google.protobuf.Timestamp update_time = 3 [(buf.validate.field).required = true];
  // The scope of the Webhook.
  oneof scope {
    option (buf.validate.oneof).required = true;
    // The id of the User or Organization that the Webhook is scoped to.
    //
    // The Webhook receives the subscribed Events for all Modules owned by the Owner,
    // including Events for Modules that are created after the Webhook.
    string owner_id = 4 [(buf.validate.field).string.tuuid = true];
    // The id of the Module that the Webhook is scoped to.
    //
    // The Webhook receives the subscribed Events for this Module only. Module-scoped
    // Webhooks never receive EVENT_TYPE_MODULE_CREATED Events.
    string module_id = 5 [(buf.validate.field).string.tuuid = true];
  }
  // The types of Events that the Webhook subscribes to.
  repeated EventType event_types = 6 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 16,
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items.enum.defined_only = true,
    (buf.validate.field).repeated.items.enum.not_in = 0
  ];
  // The URL that Events are delivered to.
  string url = 7 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uri = true,
    (buf.validate.field).string.max_len = 1024
  ];
  // The configurable description of the Webhook.
  string description = 8 [(buf.validate.field).string.max_len = 350];
  // The state of the Webhook.
  State state = 9 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  // The signing secret is write-only: it can be set when the Webhook is created or
  // updated, and is never returned.
}

// The type of an Event.
enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  // A Commit was pushed to a Module.
  EVENT_TYPE_MODULE_COMMIT_PUSHED = 1;
  // A Label of a Module was created or moved to a different Commit.
  EVENT_TYPE_MODULE_LABEL_MOVED = 2;
  // A Module was created.
  EVENT_TYPE_MODULE_CREATED = 3;
  // A Module was deleted.
  EVENT_TYPE_MODULE_DELETED = 4;
}

// WebhookRef is a reference to a Webhook, currently only an id.
//
// This is used in requests.
message WebhookRef {
  option (buf.registry.priv.extension.v1beta1.message).request_only = true;

  oneof value {
    option (buf.validate.oneof).required = true;
    // The id of the Webhook.
    string id = 1 [(buf.validate.field).string.tuuid = true];
  }
}
