syntax = "proto3";

package buf.registry.iam.v1;

import "buf/registry/priv/extension/v1beta1/extension.proto";
import "buf/registry/priv/validate/v1beta1/validate.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/iam/v1";

// A Token on the BSR.
//
// A Token is a bearer credential that authenticates RPCs as its owning User. A Token may be
// restricted to a subset of the User's permissions via TokenScopes.
//
// Tokens are immutable once created. To change a Token's properties, delete it and create a new
// one.
//
// The secret value of a Token is returned only when the Token is created, via CreateTokensResponse.
// It cannot be retrieved afterwards.
message Token {
  option (buf.registry.priv.extension.v1beta1.message).response_only = true;

  // The id of the Token.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.tuuid = true
  ];
  // The time the Token was created.
  google.protobuf.Timestamp create_time = 2 [(buf.validate.field).required = true];
  // The time the Token expires.
  //
  // If not set, the Token does not expire.
  google.protobuf.Timestamp expire_time = 3;
  // The name of the Token.
  string name = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 256
  ];
  // The id of the User that owns the Token.
  // TODO(iam): user_owner_id? Are we going to have service accounts?
  string owner_id = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.tuuid = true
  ];
  // The scopes of the Token.
  //
  // If empty, the Token has no declared scope restrictions and its effective
  // permissions are the owner's permissions resolved at request time.
  //
  // Otherwise, the Token's effective permissions are the intersection of these
  // declared permissions and the owner's permissions resolved at request time.
  //
  // In other words, TokenScopes can restrict the permissions of a Token,
  // but cannot add any permissions that the User does not already have.
  repeated TokenScope token_scopes = 6 [(buf.validate.field).repeated.max_items = 250];
}

// A TokenScope restricts a Token to a specific resource (or globally) and a set of permissions.
message TokenScope {
  // The id of the resource that the TokenScope applies to.
  //
  // If empty, the TokenScope applies globally.
  string resource_id = 1 [
    (buf.validate.field).string.tuuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // The permissions granted by the TokenScope.
  //
  // Each entry is either a Permission name (e.g. "bsr.repository.delete") or
  // a wildcard pattern ending in ".*" that matches all Permissions sharing a
  // prefix (e.g. "bsr.repository.*").
  repeated string permissions = 2 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250,
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items.string.(buf.registry.priv.validate.v1beta1.permission_pattern) = true
  ];
}

// TokenRef is a reference to a Token, currently only an id.
//
// This is used in requests.
// TODO(iam): delete this if we aren't going to make it possible to ref by name?
message TokenRef {
  option (buf.registry.priv.extension.v1beta1.message).request_only = true;

  oneof value {
    option (buf.validate.oneof).required = true;
    // The id of the Token.
    string id = 1 [(buf.validate.field).string.tuuid = true];
  }
}
