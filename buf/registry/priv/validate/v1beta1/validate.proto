syntax = "proto2";

package buf.registry.priv.validate.v1beta1;

import "buf/validate/validate.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/priv/validate/v1beta1";

extend buf.validate.StringRules {
  // A validation rule for concrete Permission names.
  //
  // A Permission name is a dotted identifier of 2 to 255 characters. Each
  // dot-separated component starts with a lowercase letter, contains lowercase
  // letters, digits, and internal hyphens, and ends with a lowercase
  // alphanumeric character. Components may not contain consecutive hyphens.
  //
  // For example, "bsr.repository.delete".
  //
  // Use (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE for optional fields.
  optional bool permission_name = 12001 [
    (buf.validate.predefined).cel = {
      id: "string.permission_name.len"
      message: "permission name must be between 2 and 255 characters"
      expression: "this == '' || (this.size() >= 2 && this.size() <= 255)"
    },
    (buf.validate.predefined).cel = {
      id: "string.permission_name.pattern"
      message: "permission name must be a dotted identifier where each component starts with a lowercase letter, contains lowercase letters, digits, and internal hyphens, and ends with a lowercase alphanumeric character (e.g. \"bsr.repository.delete\")"
      expression: "this == '' || this.matches('^[a-z][a-z0-9]*(-[a-z0-9]+)*([.][a-z][a-z0-9]*(-[a-z0-9]+)*)*$')"
    },
    (buf.validate.predefined).cel = {
      id: "string.permission_name.empty"
      message: "permission name must not be empty"
      expression: "this != ''"
    }
  ];

  // A validation rule for Permission patterns.
  //
  // A Permission pattern is either a concrete Permission name or a Permission
  // name followed by ".*" to match all Permissions sharing the preceding
  // prefix, for example "bsr.repository.*".
  //
  // Patterns are used when granting Permissions (for example in a TokenScope),
  // not when naming a concrete Permission.
  //
  // Use (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE for optional fields.
  optional bool permission_pattern = 12002 [
    (buf.validate.predefined).cel = {
      id: "string.permission_pattern.len"
      message: "permission pattern must be between 2 and 255 characters"
      expression: "this == '' || (this.size() >= 2 && this.size() <= 255)"
    },
    (buf.validate.predefined).cel = {
      id: "string.permission_pattern.pattern"
      message: "permission pattern must be a permission name, optionally ending with \".*\" to match all permissions sharing a prefix, where each component starts with a lowercase letter, contains lowercase letters, digits, and internal hyphens, and ends with a lowercase alphanumeric character (e.g. \"bsr.repository.delete\" or \"bsr.repository.*\")"
      expression: "this == '' || this.matches('^[a-z][a-z0-9]*(-[a-z0-9]+)*([.][a-z][a-z0-9]*(-[a-z0-9]+)*)*([.][*])?$')"
    },
    (buf.validate.predefined).cel = {
      id: "string.permission_pattern.empty"
      message: "permission pattern must not be empty"
      expression: "this != ''"
    }
  ];

  // A validation rule for Role names.
  //
  // A Role name is an identifier of 3 to 64 characters. It starts with a
  // lowercase letter, contains lowercase letters, digits, and internal
  // hyphens, and ends with a lowercase alphanumeric character. It may not
  // contain consecutive hyphens.
  //
  // For example, "bsr-admin".
  //
  // Use (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE for optional fields.
  optional bool role_name = 12003 [
    (buf.validate.predefined).cel = {
      id: "string.role_name.len"
      message: "role name must be between 3 and 64 characters"
      expression: "this == '' || (this.size() >= 3 && this.size() <= 64)"
    },
    (buf.validate.predefined).cel = {
      id: "string.role_name.pattern"
      message: "role name must be an identifier that starts with a lowercase letter, contains lowercase letters, digits, and internal hyphens, and ends with a lowercase alphanumeric character (e.g. \"bsr-admin\")"
      expression: "this == '' || this.matches('^[a-z][a-z0-9]*(-[a-z0-9]+)*$')"
    },
    (buf.validate.predefined).cel = {
      id: "string.role_name.empty"
      message: "role name must not be empty"
      expression: "this != ''"
    }
  ];
}
