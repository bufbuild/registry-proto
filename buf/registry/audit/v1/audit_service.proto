syntax = "proto3";

package buf.registry.audit.v1;

import "buf/registry/audit/v1/action.proto";
import "buf/registry/audit/v1/event.proto";
import "buf/registry/audit/v1/resource.proto";
import "buf/registry/owner/v1/owner.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/audit/v1";

// AuditService provides read-only access to the BSR audit log.
//
// The audit log is an immutable, append-only record of actions taken within the BSR.
service AuditService {
  // Get Events by id.
  rpc GetEvents(GetEventsRequest) returns (GetEventsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // List Events, optionally filtered by time range, actor, resource, and/or action.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message GetEventsRequest {
  // The ids of the Events to retrieve.
  repeated string event_ids = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250,
    (buf.validate.field).repeated.items.string.tuuid = true
  ];
}

message GetEventsResponse {
  // The retrieved Events in the same order as requested.
  repeated Event events = 1 [(buf.validate.field).repeated.min_items = 1];
}

message ListEventsRequest {
  // The list order.
  enum Order {
    ORDER_UNSPECIFIED = 0;
    // Order by event_time newest to oldest.
    ORDER_EVENT_TIME_DESC = 1;
    // Order by event_time oldest to newest.
    ORDER_EVENT_TIME_ASC = 2;
  }
  // The maximum number of items to return.
  //
  // The default value is 10.
  uint32 page_size = 1 [(buf.validate.field).uint32.lte = 250];
  // The page to start from.
  //
  // If empty, the first page is returned.
  string page_token = 2 [(buf.validate.field).string.max_len = 4096];
  // Only return events at or after this time, inclusive.
  //
  // If not set, there is no lower bound.
  google.protobuf.Timestamp start_time = 3;
  // Only return events before this time, exclusive.
  //
  // If not set, there is no upper bound.
  google.protobuf.Timestamp end_time = 4;
  // Filter to events performed by any of the given actors.
  //
  // If empty, events from all actors are returned.
  repeated buf.registry.owner.v1.OwnerRef actor_refs = 5 [(buf.validate.field).repeated.max_items = 250];
  // Filter to events affecting any of the resources with these ids.
  //
  // If empty, events for resources with any id are returned.
  repeated string resource_ids = 6 [
    (buf.validate.field).repeated.max_items = 250,
    (buf.validate.field).repeated.items.string.tuuid = true
  ];
  // Filter to events affecting resources owned by any of these Users or Organizations.
  //
  // If empty, events for resources with any owner are returned.
  repeated buf.registry.owner.v1.OwnerRef resource_owner_refs = 7 [(buf.validate.field).repeated.max_items = 250];
  // Filter to events affecting resources of any of these types.
  //
  // If empty, events for resources of any type are returned.
  repeated ResourceType resource_types = 8 [
    (buf.validate.field).repeated.max_items = 250,
    (buf.validate.field).repeated.items.enum.defined_only = true
  ];
  // Filter to events whose action matches any of the given actions.
  //
  // If empty, events for all actions are returned.
  repeated Action actions = 9 [
    (buf.validate.field).repeated.max_items = 250,
    (buf.validate.field).repeated.items.enum.defined_only = true
  ];
  // The order to return the Events.
  //
  // If not specified, defaults to ORDER_EVENT_TIME_DESC.
  Order order = 10 [(buf.validate.field).enum.defined_only = true];
}

message ListEventsResponse {
  // The next page token.
  //
  // If empty, there are no more pages.
  string next_page_token = 1 [(buf.validate.field).string.max_len = 4096];
  // The listed Events.
  repeated Event events = 2;
}
