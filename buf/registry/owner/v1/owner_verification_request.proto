syntax = "proto3";

package buf.registry.owner.v1;

import "buf/registry/owner/v1/owner.proto";
import "buf/registry/priv/extension/v1beta1/extension.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/owner/v1";

// A pending request to verify an Owner.
//
// An OwnerVerificationRequest exists only while it is pending: it is created when
// verification is requested for an Owner, and it is removed when the Owner's verification
// status changes, or when it is deleted by the requester or an administrator. An Owner has
// at most one OwnerVerificationRequest at a time.
//
// The history of verification decisions is not exposed by this entity; it is recorded in
// the audit log.
message OwnerVerificationRequest {
  option (buf.registry.priv.extension.v1beta1.message).response_only = true;

  // The id of the OwnerVerificationRequest.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.tuuid = true
  ];
  // The time the OwnerVerificationRequest was created.
  google.protobuf.Timestamp create_time = 2 [(buf.validate.field).required = true];
  // The id of the User or Organization that verification is requested for.
  string owner_id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.tuuid = true
  ];
  // The id of the User that requested verification.
  string requested_by_user_id = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.tuuid = true
  ];
  // The configurable comment provided with the request, for example a justification for
  // why the Owner should be verified.
  string comment = 5 [(buf.validate.field).string.max_len = 2048];
}

// OwnerVerificationRequestRef is a reference to an OwnerVerificationRequest, either by its
// id or by the Owner it requests verification for.
//
// An Owner has at most one OwnerVerificationRequest at a time, so an Owner uniquely
// identifies an OwnerVerificationRequest.
//
// This is used in requests.
message OwnerVerificationRequestRef {
  option (buf.registry.priv.extension.v1beta1.message).request_only = true;

  oneof value {
    option (buf.validate.oneof).required = true;
    // The id of the OwnerVerificationRequest.
    string id = 1 [(buf.validate.field).string.tuuid = true];
    // The Owner that verification is requested for.
    OwnerRef owner_ref = 2;
  }
}
