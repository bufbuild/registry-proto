syntax = "proto3";

package buf.registry.admin.v1;

import "buf/registry/owner/v1/organization_settings.proto";
import "buf/registry/priv/extension/v1beta1/extension.proto";
import "buf/validate/validate.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/admin/v1";

// The settings of a BSR instance.
//
// Settings control instance-wide behavior. An instance whose settings have never been
// updated has settings consisting entirely of server-applied defaults.
//
// This is deliberately limited to the settings that gate headless operation of the
// instance. It is not the deployment configuration surface.
message InstanceSettings {
  option (buf.registry.priv.extension.v1beta1.message).response_only = true;

  // The instance-wide visibility defaults for resources.
  //
  // There is at most one entry per ResourceType. A ResourceType without an entry has no
  // instance-level visibility default. A strict instance-level visibility default takes
  // precedence over an Organization-level default for the same ResourceType.
  repeated buf.registry.owner.v1.ResourceVisibilityDefault resource_visibility_defaults = 1 [
    (buf.validate.field).repeated.max_items = 16,
    (buf.validate.field).cel = {
      id: "resource_visibility_defaults.resource_type_unique"
      message: "resource_type must be unique across resource_visibility_defaults"
      expression: "this.map(e, e.resource_type).unique()"
    }
  ];
  // The instance-wide management rules for Plugins.
  //
  // There is at most one entry per Plugin. A Plugin without an entry is enabled with no
  // version constraints.
  repeated PluginRule plugin_rules = 2 [
    (buf.validate.field).repeated.max_items = 250,
    (buf.validate.field).cel = {
      id: "plugin_rules.plugin_id_unique"
      message: "plugin_id must be unique across plugin_rules"
      expression: "this.map(e, e.plugin_id).unique()"
    }
  ];
  // The ids of the Plugins whose generated SDKs are recommended on this instance.
  //
  // Recommended SDKs are surfaced first when a client asks how to consume a Module, for
  // example in SDK listings.
  repeated string recommended_plugin_ids = 3 [
    (buf.validate.field).repeated.max_items = 50,
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items.string.tuuid = true
  ];
}

// An instance-wide management rule for a single Plugin.
message PluginRule {
  option (buf.registry.priv.extension.v1beta1.message).response_only = true;

  // The state of a Plugin on the instance.
  enum State {
    STATE_UNSPECIFIED = 0;
    // The Plugin is enabled and may be used.
    STATE_ENABLED = 1;
    // The Plugin is disabled and may not be used, for example for code generation.
    STATE_DISABLED = 2;
  }
  // The id of the Plugin that the rule applies to.
  string plugin_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.tuuid = true
  ];
  // The state of the Plugin on the instance.
  State state = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
  // The version constraints for the Plugin on the instance.
  //
  // A Plugin version must satisfy all constraints to be used. If empty, all versions may
  // be used.
  repeated VersionConstraint version_constraints = 3 [(buf.validate.field).repeated.max_items = 16];
}

// A constraint on the versions of a Plugin that may be used.
message VersionConstraint {
  // The relational operator that compares a Plugin version to the constraint version.
  enum Operator {
    OPERATOR_UNSPECIFIED = 0;
    // The Plugin version must be equal to the constraint version.
    OPERATOR_EQUAL = 1;
    // The Plugin version must not be equal to the constraint version.
    OPERATOR_NOT_EQUAL = 2;
    // The Plugin version must be greater than the constraint version.
    OPERATOR_GREATER_THAN = 3;
    // The Plugin version must be less than the constraint version.
    OPERATOR_LESS_THAN = 4;
    // The Plugin version must be greater than or equal to the constraint version.
    OPERATOR_GREATER_THAN_OR_EQUAL = 5;
    // The Plugin version must be less than or equal to the constraint version.
    OPERATOR_LESS_THAN_OR_EQUAL = 6;
  }
  // The relational operator of the constraint.
  Operator operator = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
  // The SemVer-formatted version that Plugin versions are compared against.
  string version = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 64
  ];
}
