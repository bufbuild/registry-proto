syntax = "proto3";

package buf.registry.webhook.v1;

import "buf/registry/webhook/v1/event_delivery.proto";
import "buf/registry/webhook/v1/webhook.proto";
import "buf/validate/validate.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/webhook/v1";

service EventDeliveryService {
  // List EventDeliveries for a Webhook.
  rpc ListEventDeliveries(ListEventDeliveriesRequest) returns (ListEventDeliveriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Send Events in STATE_PENDING or STATE_FAILED again.
  rpc RedeliverEventDeliveries(RedeliverEventDeliveriesRequest) returns (RedeliverEventDeliveriesResponse);
}

message ListEventDeliveriesRequest {
  // The list order.
  enum Order {
    ORDER_UNSPECIFIED = 0;
    // Order by the time the delivery was created, newest to oldest.
    ORDER_CREATE_TIME_DESC = 1;
    // Order by the time the delivery was created, oldest to newest.
    ORDER_CREATE_TIME_ASC = 2;
  }
  // The maximum number of items to return on a page.
  //
  // The default value is 10.
  uint32 page_size = 1 [(buf.validate.field).uint32.lte = 250];
  // The page to start from.
  //
  // If empty, the first page is returned.
  string page_token = 2 [(buf.validate.field).string.max_len = 4096];
  // The Webhook to list EventDeliveries for.
  WebhookRef webhook_ref = 3 [(buf.validate.field).required = true];
  // The order to return the EventDeliveries.
  //
  // If not specified, defaults to ORDER_CREATE_TIME_DESC.
  Order order = 4 [(buf.validate.field).enum.defined_only = true];
  // Only return EventDeliveries in these states.
  //
  // If empty, EventDeliveries are not filtered by state.
  repeated EventDelivery.State states = 5 [
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items.enum.defined_only = true,
    (buf.validate.field).repeated.items.enum.not_in = 0
  ];
}
message ListEventDeliveriesResponse {
  // The next page token.
  //
  // If empty, there are no more pages.
  string next_page_token = 1 [(buf.validate.field).string.max_len = 4096];
  // The listed EventDeliveries.
  repeated EventDelivery event_deliveries = 2;
}

message RedeliverEventDeliveriesRequest {
  // The ids of the Events to send again.
  repeated string event_ids = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250,
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items.string.tuuid = true
  ];
}
message RedeliverEventDeliveriesResponse {
  // The redelivered EventDeliveries in the same order as requested.
  repeated EventDelivery event_deliveries = 1 [(buf.validate.field).repeated.min_items = 1];
}
