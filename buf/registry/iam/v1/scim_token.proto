syntax = "proto3";

package buf.registry.iam.v1;

import "buf/registry/priv/extension/v1beta1/extension.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/iam/v1";

// A SCIM Token on the BSR.
//
// A SCIM Token is a bearer credential used to authenticate to the instance's SCIM API for
// IdP-driven User provisioning. Unlike a Token, a SCIM Token is an instance-level credential: it
// is not owned by a User and carries no ScopedPermissions.
//
// A SCIM Token is immutable. The secret value of a SCIM Token is returned only when it is created,
// via CreateScimTokensResponse. It cannot be retrieved afterwards.
message ScimToken {
  option (buf.registry.priv.extension.v1beta1.message).response_only = true;

  // The id of the SCIM Token.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.tuuid = true
  ];
  // The time the SCIM Token was created.
  google.protobuf.Timestamp create_time = 2 [(buf.validate.field).required = true];
  // The time the SCIM Token expires.
  //
  // If not set, the SCIM Token does not expire.
  google.protobuf.Timestamp expire_time = 3;
}

// ScimTokenRef is a reference to a SCIM Token.
//
// This is used in requests.
message ScimTokenRef {
  option (buf.registry.priv.extension.v1beta1.message).request_only = true;

  oneof value {
    option (buf.validate.oneof).required = true;
    // The id of the SCIM Token.
    string id = 1 [(buf.validate.field).string.tuuid = true];
  }
}
