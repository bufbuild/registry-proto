syntax = "proto3";

package buf.registry.iam.v1;

import "buf/registry/iam/v1/role.proto";
import "buf/registry/iam/v1/role_binding.proto";
import "buf/registry/iam/v1/subject.proto";
import "buf/validate/validate.proto";

// Operate on RoleBindings.
service RoleBindingService {
  // Get RoleBindings by ID.
  rpc GetRoleBindings(GetRoleBindingsRequest) returns (GetRoleBindingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // List RoleBindings.
  rpc ListRoleBindings(ListRoleBindingsRequest) returns (ListRoleBindingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Creates a new RoleBinding that associates a Role with a Subject. The Subject is granted the
  // Role for the Resource referenced by the RoleBinding.
  //
  // This operation is atomic. Either all RoleBindings are created or an error is returned.
  rpc CreateRoleBindings(CreateRoleBindingsRequest) returns (CreateRoleBindingsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Updates existing RoleBindings.
  //
  // This operation is atomic. Either all RoleBindings are updated or an error is returned.
  rpc UpdateRoleBindings(UpdateRoleBindingsRequest) returns (UpdateRoleBindingsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Delete RoleBindings by ID.
  //
  // This operation is atomic. Either all RoleBindings are deleted or an error is returned.
  rpc DeleteRoleBindings(DeleteRoleBindingsRequest) returns (DeleteRoleBindingsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message GetRoleBindingsRequest {
  // The IDs of the RoleBindings to get.
  repeated string ids = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250,
    (buf.validate.field).repeated.items.string.tuuid = true
  ];
}

message GetRoleBindingsResponse {
  // The retrieved RoleBindings in the same order as requested.
  repeated RoleBinding role_bindings = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message ListRoleBindingsRequest {
  // The list order.
  enum Order {
    ORDER_UNSPECIFIED = 0;
    // Order by create_time newest to oldest.
    ORDER_CREATE_TIME_DESC = 1;
    // Order by create_time oldest to newest.
    ORDER_CREATE_TIME_ASC = 2;
  }
  // The maximum number of RoleBindings to return.
  //
  // The default value is 10.
  uint32 page_size = 1 [(buf.validate.field).uint32.lte = 250];
  // The page to start from.
  //
  // If empty, the first page is returned.
  string page_token = 2 [(buf.validate.field).string.max_len = 4096];
  // The order to return the RoleBindings.
  //
  // If not specified, defaults to ORDER_CREATE_TIME_DESC.
  Order order = 3 [(buf.validate.field).enum.defined_only = true];
  // The ref of the Subject for which to list RoleBindings.
  //
  // If not specified, RoleBindings are not filtered for a specific Subject.
  SubjectRef subject_ref = 4;
  // The ID of the Resource for which to list RoleBindings.
  //
  // If not specified, RoleBindings are not filtered for a specific Resource.
  string resource_id = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.tuuid = true
  ];
  // The ref of the Role for which to list RoleBindings.
  //
  // If not specified, RoleBindings are not filtered for a specific Role.
  RoleRef role_ref = 6;
}

message ListRoleBindingsResponse {
  // The next page token.
  //
  // If empty, there are no more pages.
  string next_page_token = 1 [(buf.validate.field).string.max_len = 4096];
  // The list of RoleBindings for the requested subject.
  repeated RoleBinding role_bindings = 2;
}

message CreateRoleBindingsRequest {
  // An individual request to create a RoleBinding.
  message Value {
    // The ref of the Role to bind.
    RoleRef role_ref = 1 [(buf.validate.field).required = true];
    // The ref of the Subject to bind the Role to.
    //
    // If the Subject is a Team, the Team must be global or belong to the same Resource, or an
    // ancestor Resource, as the RoleBinding. For example, a Team in Resource A can be bound to
    // Resource A, or any descendant Resource of A.
    SubjectRef subject_ref = 2 [(buf.validate.field).required = true];
    // The ID of the Resource to bind the Role to.
    //
    // If empty, the RoleBinding is global.
    string resource_id = 3 [
      (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
      (buf.validate.field).string.tuuid = true
    ];
  }
  // The RoleBindings to create.
  repeated Value values = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message CreateRoleBindingsResponse {
  // The created RoleBindings in the same order as requested.
  repeated RoleBinding role_bindings = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message UpdateRoleBindingsRequest {
  // An individual request to update a RoleBinding.
  message Value {
    // The ID of the RoleBinding to update.
    string id = 1 [
      (buf.validate.field).required = true,
      (buf.validate.field).string.tuuid = true
    ];
    // The ref of the new Role to bind.
    //
    // The new Role's resource_type_scope must be compatible with the RoleBinding's Resource.
    optional RoleRef role_ref = 2;
  }
  // The RoleBindings to update.
  repeated Value values = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message UpdateRoleBindingsResponse {
  // The updated RoleBindings in the same order as requested.
  repeated RoleBinding role_bindings = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message DeleteRoleBindingsRequest {
  // The IDs of the RoleBindings to delete.
  repeated string ids = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250,
    (buf.validate.field).repeated.items.string.tuuid = true
  ];
}

message DeleteRoleBindingsResponse {}
