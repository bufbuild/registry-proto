syntax = "proto3";

package buf.registry.owner.v1;

import "buf/registry/owner/v1/organization.proto";
import "buf/registry/owner/v1/user.proto";
import "buf/registry/priv/extension/v1beta1/extension.proto";
import "buf/registry/resource/v1/resource_visibility_control.proto";
import "buf/validate/validate.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/owner/v1";

// Operate on Organizations
service OrganizationService {
  // Get Organizations by id or name.
  rpc GetOrganizations(GetOrganizationsRequest) returns (GetOrganizationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (buf.registry.priv.extension.v1beta1.method).required_permission = "bsr.organization.get";
  }
  // List Organizations, usually by User.
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    // The Permission required depends on the request: listing all Organizations
    // on the instance (no user_refs) requires the bsr.organization.list
    // Permission. Listing the Organizations of specific Users requires no
    // Permission: the response is restricted to the Organizations whose
    // memberships the caller may read (the bsr.organization-membership.get
    // Permission).
    option (buf.registry.priv.extension.v1beta1.method).dynamic_permission = true;
  }
  // Create new Organizations.
  //
  // This operation is atomic. Either all Organizations are created or an error is returned.
  rpc CreateOrganizations(CreateOrganizationsRequest) returns (CreateOrganizationsResponse) {
    option idempotency_level = IDEMPOTENT;
    option (buf.registry.priv.extension.v1beta1.method).required_permission = "bsr.organization.create";
  }
  // Update existing organizations.
  //
  // This operation is atomic. Either all Organizations are updated or an error is returned.
  rpc UpdateOrganizations(UpdateOrganizationsRequest) returns (UpdateOrganizationsResponse) {
    option idempotency_level = IDEMPOTENT;
    option (buf.registry.priv.extension.v1beta1.method).required_permission = "bsr.organization.update";
  }
  // Delete existing organizations.
  //
  // This operation is atomic. Either all Organizations are deleted or an error is returned.
  rpc DeleteOrganizations(DeleteOrganizationsRequest) returns (DeleteOrganizationsResponse) {
    option idempotency_level = IDEMPOTENT;
    option (buf.registry.priv.extension.v1beta1.method).required_permission = "bsr.organization.delete";
  }
  // Get the settings of Organizations.
  rpc GetOrganizationSettings(GetOrganizationSettingsRequest) returns (GetOrganizationSettingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (buf.registry.priv.extension.v1beta1.method).required_permission = "bsr.organization-settings.get";
  }
  // Update the settings of Organizations.
  //
  // This operation is atomic. Either all OrganizationSettings are updated or an error is
  // returned.
  rpc UpdateOrganizationSettings(UpdateOrganizationSettingsRequest) returns (UpdateOrganizationSettingsResponse) {
    option idempotency_level = IDEMPOTENT;
    option (buf.registry.priv.extension.v1beta1.method).required_permission = "bsr.organization-settings.update";
  }
}

message GetOrganizationsRequest {
  // The Organizations to request.
  repeated OrganizationRef organization_refs = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message GetOrganizationsResponse {
  // The retrieved Organizations in the same order as requested.
  repeated Organization organizations = 1 [(buf.validate.field).repeated.min_items = 1];
}

message ListOrganizationsRequest {
  // The list order.
  enum Order {
    ORDER_UNSPECIFIED = 0;
    // Order by create_time newest to oldest.
    ORDER_CREATE_TIME_DESC = 1;
    // Order by create_time oldest to newest.
    ORDER_CREATE_TIME_ASC = 2;
  }
  // The maximum number of items to return.
  //
  // The default value is 10.
  uint32 page_size = 1 [(buf.validate.field).uint32.lte = 250];
  // The page to start from.
  //
  // If empty, the first page is returned.
  string page_token = 2 [(buf.validate.field).string.max_len = 4096];
  // The ids of the specific Users to list Organizations for.
  //
  // If this is empty, all Organizations are listed, but this functionality
  // is limited to Users with the necessary permissions.
  repeated UserRef user_refs = 3;
  // The order to return the Organizations.
  //
  // If not specified, defaults to ORDER_CREATE_TIME_DESC.
  Order order = 4 [(buf.validate.field).enum.defined_only = true];
}

message ListOrganizationsResponse {
  // The next page token.
  //
  // If empty, there are no more pages.
  string next_page_token = 1 [(buf.validate.field).string.max_len = 4096];
  // The listed Organizations.
  repeated Organization organizations = 2;
}

message CreateOrganizationsRequest {
  // An individual request to create an Organization.
  message Value {
    // The name of the Organization.
    string name = 1 [
      (buf.validate.field).required = true,
      (buf.validate.field).string.min_len = 1,
      (buf.validate.field).string.max_len = 32,
      (buf.validate.field).string.pattern = "^[a-z]([a-z0-9-]*[a-z0-9])?$"
    ];
    // The configurable description of the Organization.
    string description = 2 [(buf.validate.field).string.max_len = 350];
    // The configurable URL that represents the homepage for an Organization.
    string url = 3 [
      (buf.validate.field).string.uri = true,
      (buf.validate.field).string.max_len = 255,
      (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
    ];
    // The verification status of the Organization.
    //
    // If not set, the Organization will default to VERIFICATION_STATUS_UNVERIFIED.
    OrganizationVerificationStatus verification_status = 4 [(buf.validate.field).enum.defined_only = true];
    // If not set, the Organization will default to ORGANIZATION_VISIBILITY_PUBLIC.
    optional OrganizationVisibility visibility = 5 [
      (buf.validate.field).enum.defined_only = true,
      (buf.validate.field).enum.not_in = 0
    ];
  }
  // The Organizations to create.
  repeated Value values = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message CreateOrganizationsResponse {
  // The created Organizations in the same order as given on the request.
  repeated Organization organizations = 1 [(buf.validate.field).repeated.min_items = 1];
}

message UpdateOrganizationsRequest {
  // An individual request to update an Organization.
  message Value {
    // The organization to update.
    OrganizationRef organization_ref = 1 [(buf.validate.field).required = true];
    // The configurable description of the Organization.
    optional string description = 2 [(buf.validate.field).string.max_len = 350];
    // The configurable URL that represents the homepage for an Organization.
    optional string url = 3 [
      (buf.validate.field).cel = {
        id: "uri_or_empty"
        expression: "this == '' || this.isUri()"
        message: "value must be a valid URI"
      },
      (buf.validate.field).string.max_len = 255
    ];
    // The verification status of the Organization.
    optional OrganizationVerificationStatus verification_status = 4 [
      (buf.validate.field).enum.defined_only = true,
      (buf.validate.field).enum.not_in = 0
    ];
    optional OrganizationVisibility visibility = 5 [
      (buf.validate.field).enum.defined_only = true,
      (buf.validate.field).enum.not_in = 0
    ];
  }
  // The Organizations to update.
  repeated Value values = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message UpdateOrganizationsResponse {
  // The updated Organizations in the same order as given on the request.
  repeated Organization organizations = 1 [(buf.validate.field).repeated.min_items = 1];
}

message DeleteOrganizationsRequest {
  // The Organizations to delete.
  repeated OrganizationRef organization_refs = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message DeleteOrganizationsResponse {}

message GetOrganizationSettingsRequest {
  // The Organizations to retrieve settings for.
  repeated OrganizationRef organization_refs = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message GetOrganizationSettingsResponse {
  // The retrieved OrganizationSettings in the same order as requested.
  repeated OrganizationSettings organization_settings = 1 [(buf.validate.field).repeated.min_items = 1];
}

message UpdateOrganizationSettingsRequest {
  // An individual request to update the settings of an Organization.
  //
  // Only the settings that are set are updated.
  message Value {
    // The Organization to update the settings of.
    OrganizationRef organization_ref = 1 [(buf.validate.field).required = true];
    // The base role that members of the Organization receive on the Modules the Organization
    // owns.
    optional BaseResourceRole base_module_role = 2 [
      (buf.validate.field).enum.defined_only = true,
      (buf.validate.field).enum.not_in = 0
    ];
    // The base role that members of the Organization receive on the Plugins the Organization
    // owns.
    optional BaseResourceRole base_plugin_role = 3 [
      (buf.validate.field).enum.defined_only = true,
      (buf.validate.field).enum.not_in = 0
    ];
    // The base role that members of the Organization receive on the Policies the Organization
    // owns.
    optional BaseResourceRole base_policy_role = 4 [
      (buf.validate.field).enum.defined_only = true,
      (buf.validate.field).enum.not_in = 0
    ];
    // The Organization's visibility control for the Modules it owns to set.
    //
    // If unset, the Module visibility control is left unchanged.
    buf.registry.resource.v1.ResourceVisibilityControl module_visibility_control = 5;
    // The Organization's visibility control for the Plugins it owns to set.
    //
    // If unset, the Plugin visibility control is left unchanged.
    buf.registry.resource.v1.ResourceVisibilityControl plugin_visibility_control = 6;
    // The Organization's visibility control for the Policies it owns to set.
    //
    // If unset, the Policy visibility control is left unchanged.
    buf.registry.resource.v1.ResourceVisibilityControl policy_visibility_control = 7;
  }
  // The OrganizationSettings to update.
  repeated Value values = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message UpdateOrganizationSettingsResponse {
  // The updated OrganizationSettings in the same order as given on the request.
  repeated OrganizationSettings organization_settings = 1 [(buf.validate.field).repeated.min_items = 1];
}
