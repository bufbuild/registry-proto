syntax = "proto3";

package buf.registry.priv.extension.v1beta1;

import "buf/registry/priv/validate/v1beta1/validate.proto";
import "buf/validate/validate.proto";
import "google/protobuf/descriptor.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/priv/extension/v1beta1";

extend google.protobuf.MessageOptions {
  // Constraints on a message.
  //
  // Prototyping for now - we will want to change this to a number in Buf's reserved range if
  // this goes further.
  MessageConstraints message = 89181;
}

// Constraints on a message.
message MessageConstraints {
  // The given message should only be recursively used as part of RPC requests and should
  // never be part of an RPC response.
  //
  // This is not just for request/response messages, this is also for any message that
  // is part of a request. It says that the message cannot form part of a response.
  //
  // This applies to all nested messages within the message that are marked as request_only.
  //
  // Exclusive with response_only.
  //
  // TODO: Also have a marker for specific request/response messages?
  // TODO: enum?
  bool request_only = 1;
  // The given message should only be recursively used as part of RPC responses and should
  // never be part of an RPC request.
  //
  // This is not just for request/response messages, this is also for any message that
  // is part of a response. It says that the message cannot form part of a request.
  //
  // This applies to all nested messages within the message that are marked as response_only.
  //
  // Exclusive with request_only.
  //
  // TODO: Also have a marker for specific request/response messages?
  // TODO: enum?
  bool response_only = 2;
  // The given message should only be recursively used as part of RPCs that are marked
  // as NO_SIDE_EFFECTS. Typically used to denote that a message should
  // only be used in read-only contexts.
  //
  // This applies to all nested messages within the message that are marked as no_side_effects_only.
  //
  // This is not just for request/response messages, this is also for any message that
  // is part of an RPC.
  bool no_side_effects_only = 3;
}

extend google.protobuf.MethodOptions {
  // IAM constraints on a method.
  //
  // Prototyping for now - we will want to change this to a number in Buf's
  // reserved range if this goes further.
  MethodConstraints method = 89182;
}

// IAM constraints on a method.
//
// Every method either lists at least one Permission (in required_permission
// and/or conditional_permission) or sets no_required_permission to true.
// no_required_permission must be true if and only if both Permission lists are
// empty.
message MethodConstraints {
  // The names of the Permissions that are always checked when invoking this RPC.
  //
  // Each value is the name of a Permission registered on the BSR (e.g.
  // "bsr.module.delete"). Every listed Permission is checked on every call.
  repeated string required_permission = 1 [(buf.validate.field).repeated.items.string.(buf.registry.priv.validate.v1beta1.permission_name) = true];
  // The names of the Permissions that are checked only for some calls, depending
  // on the contents of the request.
  repeated string conditional_permission = 2 [(buf.validate.field).repeated.items.string.(buf.registry.priv.validate.v1beta1.permission_name) = true];
  // Explicitly declares that invoking this RPC requires no Permission.
  //
  // Must be true if and only if required_permission and conditional_permission
  // are both empty. Whether the RPC requires authentication is a separate concern.
  bool no_required_permission = 3;
}
