syntax = "proto3";

package buf.registry.webhook.v1;

import "buf/registry/module/v1/commit.proto";
import "buf/registry/module/v1/module.proto";
import "buf/registry/owner/v1/organization.proto";
import "buf/registry/webhook/v1/webhook.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/webhook/v1";

// An Event delivered to a Webhook.
//
// See EventService for delivery and retry behavior.
message Event {
  // The id of the Event.
  //
  // The same id is used for every delivery of the Event.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.tuuid = true
  ];
  // The type of the Event.
  EventType type = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.not_in = 0
  ];
  // The time the Event occurred.
  google.protobuf.Timestamp event_time = 3 [(buf.validate.field).required = true];
  // The payload of the Event, matching its type.
  oneof payload {
    // The payload for EVENT_TYPE_PING.
    PingPayload ping = 4;
    // The payload for EVENT_TYPE_MODULE_COMMITS_PUSHED.
    ModuleCommitsPushedPayload module_commits_pushed = 5;
    // The payload for EVENT_TYPE_MODULES_CREATED.
    ModulesCreatedPayload modules_created = 6;
    // The payload for EVENT_TYPE_ORGANIZATIONS_CREATED.
    OrganizationsCreatedPayload organizations_created = 7;
  }
}

// The payload of an Event of type EVENT_TYPE_PING.
message PingPayload {
  // The id of the Webhook that was pinged.
  //
  // Empty if the Webhook has not been created.
  string webhook_id = 1 [
    (buf.validate.field).string.tuuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

// The payload of an Event of type EVENT_TYPE_MODULE_COMMITS_PUSHED.
//
// Contains only the Commits within the Webhook's scope.
message ModuleCommitsPushedPayload {
  // A Commit pushed to a Module.
  message PushedCommit {
    // The Module that the Commit was pushed to.
    buf.registry.module.v1.Module module = 1 [(buf.validate.field).required = true];
    // The Commit that was pushed.
    buf.registry.module.v1.Commit commit = 2 [(buf.validate.field).required = true];
    // The labels that are associated with the Commit.
    repeated string label_names = 3 [
      (buf.validate.field).repeated.min_items = 1,
      (buf.validate.field).repeated.items = {
        string: {max_len: 250}
      }
    ];
  }
  // The Commits that were pushed.
  repeated PushedCommit pushed_commits = 1 [(buf.validate.field).repeated.min_items = 1];
}

// The payload of an Event of type EVENT_TYPE_MODULES_CREATED.
//
// Contains only the Modules within the Webhook's scope.
message ModulesCreatedPayload {
  // The Modules that were created.
  repeated buf.registry.module.v1.Module modules = 1 [(buf.validate.field).repeated.min_items = 1];
}

// The payload of an Event of type EVENT_TYPE_ORGANIZATIONS_CREATED.
message OrganizationsCreatedPayload {
  // The Organizations that were created.
  repeated buf.registry.owner.v1.Organization organizations = 1 [(buf.validate.field).repeated.min_items = 1];
}
