syntax = "proto3";

package buf.registry.iam.v1;

import "buf/registry/iam/v1/principal.proto";
import "buf/registry/iam/v1/token.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// Operate on Tokens.
service TokenService {
  // Get Tokens.
  rpc GetTokens(GetTokensRequest) returns (GetTokensResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // List all Tokens for a Principal.
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Create new Tokens for Principals.
  //
  // This operation is atomic. Either all Tokens are created or an error is returned.
  rpc CreateTokens(CreateTokensRequest) returns (CreateTokensResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Delete Tokens by ID.
  //
  // This operation is atomic. Either all Tokens are deleted or an error is returned.
  rpc DeleteTokens(DeleteTokensRequest) returns (DeleteTokensResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message GetTokensRequest {
  // The IDs of the Tokens to get.
  repeated string ids = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250,
    (buf.validate.field).repeated.items.string.tuuid = true
  ];
}

message GetTokensResponse {
  // The retrieved Tokens in the same order as requested.
  repeated Token tokens = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message ListTokensRequest {
  // The list order.
  enum Order {
    ORDER_UNSPECIFIED = 0;
    // Order by create_time newest to oldest.
    ORDER_CREATE_TIME_DESC = 1;
    // Order by create_time oldest to newest.
    ORDER_CREATE_TIME_ASC = 2;
  }
  // A filter on the state of the Token.
  enum TokenStateFilter {
    TOKEN_STATE_FILTER_UNSPECIFIED = 0;
    // Return all Tokens, regardless of their state.
    TOKEN_STATE_FILTER_ALL = 1;
    // Return only active Tokens.
    TOKEN_STATE_FILTER_ACTIVE_ONLY = 2;
    // Return only expired Tokens.
    TOKEN_STATE_FILTER_EXPIRED_ONLY = 3;
  }
  // The maximum number of Tokens to return.
  //
  // The default value is 10.
  uint32 page_size = 1 [(buf.validate.field).uint32.lte = 250];
  // The page to start from.
  //
  // If empty, the first page is returned.
  string page_token = 2 [(buf.validate.field).string.max_len = 4096];
  // The order to return the Tokens.
  //
  // If not specified, defaults to ORDER_CREATE_TIME_DESC.
  Order order = 3 [(buf.validate.field).enum.defined_only = true];
  // The Principal whose Tokens to list.
  PrincipalRef principal_ref = 4 [(buf.validate.field).required = true];
  // The Token state filter on the returned Tokens.
  //
  // If not specified, defaults to TOKEN_STATE_FILTER_ACTIVE_ONLY.
  TokenStateFilter token_state_filter = 5 [(buf.validate.field).enum.defined_only = true];
}

message ListTokensResponse {
  // The next page token.
  //
  // If empty, there are no more pages.
  string next_page_token = 1 [(buf.validate.field).string.max_len = 4096];
  // The list of Tokens.
  repeated Token tokens = 2;
}

message CreateTokensRequest {
  // An individual request to create a Token.
  message Value {
    // The Principal for which to create the Token.
    PrincipalRef principal_ref = 1 [(buf.validate.field).required = true];
    // The name of the Token.
    string name = 2 [
      (buf.validate.field).required = true,
      (buf.validate.field).string.min_len = 3,
      (buf.validate.field).string.max_len = 256
    ];
    // The description of the Token. Optional.
    string description = 3 [(buf.validate.field).string.max_len = 350];
    // The scopes of the Token. See Token.token_scopes.
    repeated TokenScope token_scopes = 4 [(buf.validate.field).repeated.max_items = 250];
    // The time the Token expires. The Token is valid until this time.
    //
    // If not specified, the token is valid indefinitely.
    google.protobuf.Timestamp expire_time = 5 [(buf.validate.field).timestamp.gt_now = true];
  }
  // The Tokens to create.
  repeated Value values = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message CreateTokensResponse {
  // An individual value for a created Token.
  message Value {
    // The created Token.
    Token token = 1 [(buf.validate.field).required = true];
    // The raw token string that can be used for authentication.
    //
    // This cannot be retrieved again later.
    string raw_token = 2 [
      (buf.validate.field).required = true,
      (buf.validate.field).string.max_len = 4096
    ];
  }
  // The created Tokens in the same order as requested.
  repeated Value values = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message DeleteTokensRequest {
  // The IDs of the Tokens to delete.
  repeated string ids = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250,
    (buf.validate.field).repeated.items.string.tuuid = true
  ];
}

message DeleteTokensResponse {}
