syntax = "proto3";

package buf.registry.iam.v1;

import "buf/registry/iam/v1/role.proto";
import "buf/registry/iam/v1/validate.proto";
import "buf/validate/validate.proto";

// Operate on Roles.
service RoleService {
  // Get Roles by ID or Name.
  rpc GetRoles(GetRolesRequest) returns (GetRolesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // List all Roles.
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Create new Roles.
  //
  // This operation is atomic. Either all Roles are created or an error is returned.
  rpc CreateRoles(CreateRolesRequest) returns (CreateRolesResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Update existing Roles.
  //
  // This operation is atomic. Either all Roles are updated or an error is returned.
  rpc UpdateRoles(UpdateRolesRequest) returns (UpdateRolesResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Delete Roles by ID.
  //
  // This operation is atomic. Either all Roles are deleted or an error is returned.
  rpc DeleteRoles(DeleteRolesRequest) returns (DeleteRolesResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message GetRolesRequest {
  // The Roles to request.
  repeated RoleRef role_refs = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message GetRolesResponse {
  // The retrieved Roles in the same order as requested.
  repeated Role roles = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message ListRolesRequest {
  // The list order.
  enum Order {
    ORDER_UNSPECIFIED = 0;
    // Order by create_time newest to oldest.
    ORDER_CREATE_TIME_DESC = 1;
    // Order by create_time oldest to newest.
    ORDER_CREATE_TIME_ASC = 2;
  }
  // The maximum number of Roles to return.
  //
  // The default value is 10.
  uint32 page_size = 1 [(buf.validate.field).uint32.lte = 250];
  // The page to start from.
  //
  // If empty, the first page is returned.
  string page_token = 2 [(buf.validate.field).string.max_len = 4096];
  // The order to return the Roles.
  //
  // If not specified, defaults to ORDER_CREATE_TIME_DESC.
  Order order = 3 [(buf.validate.field).enum.defined_only = true];
  // The ID of the Resource to filter Roles by.
  //
  // If empty, global Roles are returned.
  string resource_id = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.tuuid = true
  ];
  // The resource_type_scope to list Roles for.
  //
  // If empty, Roles are not filtered by a resource_type_scope.
  string resource_type_scope = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.(resource_type_name) = true
  ];
}

message ListRolesResponse {
  // The next page token.
  //
  // If empty, there are no more pages.
  string next_page_token = 1 [(buf.validate.field).string.max_len = 4096];
  // The list of Roles.
  repeated Role roles = 2;
}

message CreateRolesRequest {
  // An individual request to create a Role.
  message Value {
    // The ID of the Resource this Role belongs to.
    //
    // If empty, the Role is a global Role.
    string resource_id = 1 [
      (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
      (buf.validate.field).string.tuuid = true
    ];
    // The name of the Role.
    string name = 2 [(buf.validate.field).string.(role_name) = true];
    // The type of the Resource this Role can be bound to, if any.
    //
    // If set, the Role can only be bound in a RoleBinding to a Resource of this type. This is
    // not to be confused with resource_id, which identifies the Resource which owns the Role.
    string resource_type_scope = 3 [
      (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
      (buf.validate.field).string.(resource_type_name) = true
    ];
    // The permissions granted to the Role.
    repeated string permissions = 4 [
      (buf.validate.field).required = true,
      (buf.validate.field).repeated.min_items = 1,
      (buf.validate.field).repeated.max_items = 250,
      (buf.validate.field).repeated.items.string.(permission_name) = true
    ];
    // A human-readable description of the Role.
    string description = 5 [
      (buf.validate.field).required = true,
      (buf.validate.field).string.min_len = 1,
      (buf.validate.field).string.max_len = 512
    ];
  }
  // The Roles to create.
  repeated Value values = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message CreateRolesResponse {
  // The created Roles in the same order as requested.
  repeated Role roles = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message UpdateRolesRequest {
  // An individual request to update a Role.
  message Value {
    // The ref of the Role to update.
    RoleRef role_ref = 1 [(buf.validate.field).required = true];
    // The permissions granted to the Role. If non-empty, this replaces the existing permissions granted to the
    // Role.
    repeated string permissions = 2 [
      (buf.validate.field).required = true,
      (buf.validate.field).repeated.min_items = 1,
      (buf.validate.field).repeated.max_items = 250,
      (buf.validate.field).repeated.items.string.(permission_name) = true
    ];
    // A human-readable description of the Role.
    //
    // If not set, the description is not updated.
    optional string description = 3 [
      (buf.validate.field).string.min_len = 1,
      (buf.validate.field).string.max_len = 512
    ];
  }
  // The Roles to update.
  repeated Value values = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message UpdateRolesResponse {
  // The updated Roles in the same order as requested.
  repeated Role roles = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message DeleteRolesRequest {
  // The Roles to delete.
  //
  // Any RoleBindings that reference this Role are also deleted.
  //
  // It is an error to delete a Role that is referenced as a base Role for any Resource.
  repeated RoleRef role_refs = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message DeleteRolesResponse {}
