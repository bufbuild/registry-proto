syntax = "proto3";

package buf.registry.governance.v1;

import "buf/registry/priv/extension/v1beta1/extension.proto";
import "buf/validate/validate.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/governance/v1";

// The scope that a governance policy is set at.
//
// Currently only the instance scope is supported. Additional scopes, such as a single
// Organization, may be added in the future.
message GovernanceScope {
  option (buf.registry.priv.extension.v1beta1.message).request_only = true;

  // Instance scopes to the entire instance.
  message Instance {}

  oneof value {
    option (buf.validate.oneof).required = true;
    // The policy that applies instance-wide.
    Instance instance = 1;
  }
}
