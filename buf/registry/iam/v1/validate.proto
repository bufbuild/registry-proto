syntax = "proto2";

package buf.registry.iam.v1;

import "buf/validate/validate.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/iam/v1";

extend buf.validate.StringRules {
  // A validation rule for role names.
  //
  // A role name must be 2-32 characters, containing only lowercase alphanumeric characters or
  // hyphens. Additionally, it must start with a lowercase letter and end with a lowercase letter or
  // digit.
  //
  // Use (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE for optional fields.
  optional bool role_name = 11003 [
    (buf.validate.predefined).cel = {
      id: "string.role_name.len"
      message: "role name must be between 2 and 32 characters"
      expression: "this == '' || (this.size() >= 2 && this.size() <= 32)"
    },
    (buf.validate.predefined).cel = {
      id: "string.role_name.pattern"
      message: "role name must match ^[a-z][a-z0-9-]*[a-z0-9]$"
      expression: "this == '' || this.matches('^[a-z][a-z0-9-]*[a-z0-9]$')"
    },
    (buf.validate.predefined).cel = {
      id: "string.role_name.empty"
      message: "role name must not be empty"
      expression: "this != ''"
    }
  ];
}
