syntax = "proto3";

package buf.registry.iam.v1;

import "buf/registry/iam/v1/validate.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// Token is an Identity that represents a Principal authenticated via a bearer token.
//
// Tokens are immutable once created. To change a Token's properties, delete it and create a new
// one.
message Token {
  // The ID of the Token.
  //
  // The ID uniquely identifies the Token.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.tuuid = true
  ];
  // The time the Token was created.
  google.protobuf.Timestamp create_time = 2 [(buf.validate.field).required = true];
  // The time the Token expires. If not set, the Token does not expire.
  google.protobuf.Timestamp expire_time = 3;
  // The ID of the Principal who owns the Token.
  string principal_id = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.tuuid = true
  ];
  // The name of the Token. Deleted tokens' names may be reused.
  string name = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 256
  ];
  // The description of the Token. Optional.
  string description = 6 [(buf.validate.field).string.max_len = 350];
  // The scopes of the Token.
  //
  // If empty, the Token has the same permissions as the Principal, now and in the future. If not
  // empty, the Token has the intersection of the permissions defined in the TokenScopes and the
  // permissions of the Principal at the time of the request. In other words, TokenScopes can
  // _restrict_ the permissions of a Token, but not _add_ any permissions that the Principal does
  // not have.
  repeated TokenScope token_scopes = 7 [(buf.validate.field).repeated.max_items = 250];
}

// A TokenScope is a restriction of the permissions of a Token to a specific Resource (or globally)
// and set of permissions.
message TokenScope {
  // The ID of the Resource that the TokenScope applies to.
  //
  // If empty, the TokenScope applies globally.
  string resource_id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.tuuid = true
  ];
  // The permissions of the TokenScope.
  //
  // See Role.permissions for details about permissions.
  repeated string permissions = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250,
    (buf.validate.field).repeated.items.string.(permission_name) = true
  ];
}
