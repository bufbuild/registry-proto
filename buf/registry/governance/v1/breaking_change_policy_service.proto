syntax = "proto3";

package buf.registry.governance.v1;

import "buf/registry/governance/v1/breaking_change_policy.proto";
import "buf/registry/governance/v1/governance_scope.proto";
import "buf/validate/validate.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/governance/v1";

// Operate on the breaking change policy.
//
// The policy is administered by Users with instance-level administrative permissions,
// but is readable by any authenticated User, as it affects how every Module on the
// instance behaves.
service BreakingChangePolicyService {
  // Get the breaking change policy at a scope.
  rpc GetBreakingChangePolicy(GetBreakingChangePolicyRequest) returns (GetBreakingChangePolicyResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Update the breaking change policy at a scope.
  rpc UpdateBreakingChangePolicy(UpdateBreakingChangePolicyRequest) returns (UpdateBreakingChangePolicyResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message GetBreakingChangePolicyRequest {
  // The scope to retrieve the breaking change policy for.
  GovernanceScope scope = 1 [(buf.validate.field).required = true];
}

message GetBreakingChangePolicyResponse {
  // The breaking change policy.
  BreakingChangePolicy breaking_change_policy = 1 [(buf.validate.field).required = true];
}

message UpdateBreakingChangePolicyRequest {
  // The scope to update the breaking change policy at.
  GovernanceScope scope = 1 [(buf.validate.field).required = true];
  // The breaking change policy to set.
  BreakingChangePolicy breaking_change_policy = 2 [(buf.validate.field).required = true];
}

message UpdateBreakingChangePolicyResponse {
  // The breaking change policy after the update was applied.
  BreakingChangePolicy breaking_change_policy = 1 [(buf.validate.field).required = true];
}
