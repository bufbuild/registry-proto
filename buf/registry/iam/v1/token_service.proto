syntax = "proto3";

package buf.registry.iam.v1;

import "buf/registry/iam/v1/token.proto";
import "buf/registry/owner/v1/user.proto";
import "buf/registry/priv/extension/v1beta1/extension.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/iam/v1";

// Operate on Tokens.
service TokenService {
  // Get Tokens by id.
  rpc GetTokens(GetTokensRequest) returns (GetTokensResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (buf.registry.priv.extension.v1beta1.method).required_permission = "bsr.token.get";
  }
  // List Tokens, usually for a User.
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (buf.registry.priv.extension.v1beta1.method).required_permission = "bsr.token.list";
  }
  // Create new Tokens.
  //
  // The secret value of each Token is returned only in the response to this call. It cannot be
  // retrieved afterwards.
  //
  // This operation is atomic. Either all Tokens are created or an error is returned.
  //
  // This operation is not idempotent: each call mints a new Token with a new secret value.
  rpc CreateTokens(CreateTokensRequest) returns (CreateTokensResponse) {
    option (buf.registry.priv.extension.v1beta1.method).required_permission = "bsr.token.create";
  }
  // Update existing Tokens.
  //
  // Updating a Token does not change its secret value. To rotate a Token's credential, delete it
  // and create a new one.
  //
  // This operation is atomic. Either all Tokens are updated or an error is returned.
  rpc UpdateTokens(UpdateTokensRequest) returns (UpdateTokensResponse) {
    option idempotency_level = IDEMPOTENT;
    option (buf.registry.priv.extension.v1beta1.method).required_permission = "bsr.token.update";
  }
  // Delete existing Tokens.
  //
  // This operation is atomic. Either all Tokens are deleted or an error is returned.
  rpc DeleteTokens(DeleteTokensRequest) returns (DeleteTokensResponse) {
    option idempotency_level = IDEMPOTENT;
    option (buf.registry.priv.extension.v1beta1.method).required_permission = "bsr.token.delete";
  }
}

message GetTokensRequest {
  // The Tokens to request.
  repeated TokenRef token_refs = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message GetTokensResponse {
  // The retrieved Tokens in the same order as requested.
  repeated Token tokens = 1 [(buf.validate.field).repeated.min_items = 1];
}

message ListTokensRequest {
  // The list order.
  enum Order {
    ORDER_UNSPECIFIED = 0;
    // Order by create_time newest to oldest.
    ORDER_CREATE_TIME_DESC = 1;
    // Order by create_time oldest to newest.
    ORDER_CREATE_TIME_ASC = 2;
  }
  // The maximum number of items to return.
  //
  // The default value is 10.
  uint32 page_size = 1 [(buf.validate.field).uint32.lte = 250];
  // The page to start from.
  //
  // If empty, the first page is returned.
  string page_token = 2 [(buf.validate.field).string.max_len = 4096];
  // The specific Users to filter Tokens by.
  //
  // If empty, all Tokens the currently authenticated User has access to are listed. Listing Tokens
  // for other Users is limited to Users with the necessary permissions.
  repeated buf.registry.owner.v1.UserRef user_refs = 3 [(buf.validate.field).repeated.max_items = 250];
  // The order to return the Tokens.
  //
  // If not specified, defaults to ORDER_CREATE_TIME_DESC.
  Order order = 4 [(buf.validate.field).enum.defined_only = true];
}

message ListTokensResponse {
  // The next page token.
  //
  // If empty, there are no more pages.
  string next_page_token = 1 [(buf.validate.field).string.max_len = 4096];
  // The list of Tokens.
  repeated Token tokens = 2;
}

message CreateTokensRequest {
  // An individual request to create a Token.
  message Value {
    // The User that will own the Token.
    //
    // If not set, defaults to the currently authenticated User.
    buf.registry.owner.v1.UserRef user_ref = 1;
    // The name of the Token.
    string name = 2 [
      (buf.validate.field).required = true,
      (buf.validate.field).string.min_len = 3,
      (buf.validate.field).string.max_len = 256
    ];
    // The time the Token expires.
    //
    // If not set, the Token does not expire.
    google.protobuf.Timestamp expire_time = 3;
    // The scoped permissions of the Token.
    //
    // If empty, the Token has no declared permission restrictions and its effective
    // permissions are the owner's permissions resolved at request time.
    //
    // Otherwise, the Token's effective permissions are the intersection of these
    // declared permissions and the owner's permissions resolved at request time.
    //
    // In other words, ScopedPermissions can restrict the permissions of a Token,
    // but cannot add any permissions that the User does not already have.
    repeated ScopedPermission scoped_permissions = 4 [
      (buf.validate.field).repeated.max_items = 250,
      (buf.validate.field).cel = {
        id: "scoped_permissions.unique"
        message: "scoped permissions must have unique scope and permission pairs"
        expression: "this.map(sp, (has(sp.scope.instance) ? 'instance' : string(sp.scope.resource.resource_type) + '/' + sp.scope.resource.resource_id) + '|' + sp.permission).unique()"
      }
    ];
  }
  // The Tokens to create.
  repeated Value values = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message CreateTokensResponse {
  // An individual created Token along with its secret value.
  message Value {
    // The created Token.
    Token token = 1 [(buf.validate.field).required = true];
    // The secret value of the Token.
    //
    // This is the bearer credential used to authenticate as the Token. It is returned only here, at
    // creation time, and cannot be retrieved afterwards.
    string secret = 2 [
      debug_redact = true,
      (buf.validate.field).required = true
    ];
  }
  // The created Tokens in the same order as given on the request.
  repeated Value values = 1 [(buf.validate.field).repeated.min_items = 1];
}

message UpdateTokensRequest {
  // An individual request to update a Token.
  message Value {
    // A replacement list of ScopedPermissions.
    //
    // A message is used so that an unset field can be distinguished from an empty list.
    message ScopedPermissions {
      // The scoped permissions of the Token.
      //
      // If empty, the Token has no declared permission restrictions and its effective
      // permissions are the owner's permissions resolved at request time.
      //
      // Otherwise, the Token's effective permissions are the intersection of these
      // declared permissions and the owner's permissions resolved at request time.
      //
      // In other words, ScopedPermissions can restrict the permissions of a Token,
      // but cannot add any permissions that the User does not already have.
      repeated ScopedPermission scoped_permissions = 1 [
        (buf.validate.field).repeated.max_items = 250,
        (buf.validate.field).cel = {
          id: "scoped_permissions.unique"
          message: "scoped permissions must have unique scope and permission pairs"
          expression: "this.map(sp, (has(sp.scope.instance) ? 'instance' : string(sp.scope.resource.resource_type) + '/' + sp.scope.resource.resource_id) + '|' + sp.permission).unique()"
        }
      ];
    }
    // The reference to the Token to update.
    TokenRef token_ref = 1 [(buf.validate.field).required = true];
    // The name of the Token.
    //
    // If not set, the name is not updated.
    optional string name = 2 [
      (buf.validate.field).string.min_len = 3,
      (buf.validate.field).string.max_len = 256
    ];
    // The scoped permissions of the Token, replacing all existing scoped permissions.
    //
    // If not set, the scoped permissions are not updated. If set with an empty list, all
    // permission restrictions are removed from the Token.
    ScopedPermissions scoped_permissions = 3;
  }
  // The Tokens to update.
  repeated Value values = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message UpdateTokensResponse {
  // The updated Tokens in the same order as given on the request.
  repeated Token tokens = 1 [(buf.validate.field).repeated.min_items = 1];
}

message DeleteTokensRequest {
  // The Tokens to delete.
  repeated TokenRef token_refs = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message DeleteTokensResponse {}
