syntax = "proto3";

package buf.registry.gen.v1;

import "buf/registry/gen/v1/sdk.proto";
import "buf/registry/module/v1/resource.proto";
import "buf/registry/plugin/v1/plugin.proto";
import "buf/validate/validate.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/gen/v1";

// Resolve SDK versions and install metadata for generated SDKs.
service ResolveService {
  // Resolve the SDK version string for a Module reference generated by a generation Plugin.
  //
  // This is the lightweight counterpart to GetSDKInfos: it returns only the version string, which
  // is what a package-registry client typically needs to pin a dependency. Use GetSDKInfos when
  // the full install metadata is required.
  rpc ResolveSDKVersions(ResolveSDKVersionsRequest) returns (ResolveSDKVersionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Get the resolved install metadata (SDKInfo) for a Module reference generated by a generation
  // Plugin.
  rpc GetSDKInfos(GetSDKInfosRequest) returns (GetSDKInfosResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message ResolveSDKVersionsRequest {
  // An individual request to resolve a single SDK version.
  message Value {
    // The Module, Label, or Commit to resolve the SDK version for.
    //
    // See the documentation on ResourceRef for resource resolution details.
    buf.registry.module.v1.ResourceRef module_ref = 1 [(buf.validate.field).required = true];
    // The generation Plugin that produces the SDK.
    buf.registry.plugin.v1.GenerationPluginRef plugin_ref = 2 [(buf.validate.field).required = true];
    // The package registry to resolve the version for.
    //
    // A generation Plugin produces SDKs for exactly one registry. If set, this must match the
    // resolved Plugin's registry, and is used to validate the request. If unset, the resolved
    // Plugin's registry is used.
    buf.registry.plugin.v1.PackageRegistry registry = 3 [(buf.validate.field).enum.defined_only = true];
  }
  // The SDK versions to resolve.
  repeated Value values = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message ResolveSDKVersionsResponse {
  // A resolved SDK version.
  message Value {
    // The resolved SDK version string.
    //
    // The format is determined by the resolved Plugin's PackageRegistry.
    string version = 1 [(buf.validate.field).required = true];
  }
  // The resolved SDK versions, in the same order as requested.
  repeated Value values = 1 [(buf.validate.field).repeated.min_items = 1];
}

message GetSDKInfosRequest {
  // An individual request for the install metadata of a single SDK.
  message Value {
    // The Module, Label, or Commit to resolve install metadata for.
    //
    // See the documentation on ResourceRef for resource resolution details.
    buf.registry.module.v1.ResourceRef module_ref = 1 [(buf.validate.field).required = true];
    // The generation Plugin that produces the SDK.
    buf.registry.plugin.v1.GenerationPluginRef plugin_ref = 2 [(buf.validate.field).required = true];
    // An optional SDK version string to validate.
    //
    // If set, it is validated against the resolved Module Commit and Plugin build, and the same
    // string is returned on the resulting SDKInfo. If unset, the version is resolved from the
    // module_ref and plugin_ref.
    string sdk_version = 3 [
      (buf.validate.field).string.max_len = 250,
      (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
    ];
  }
  // The SDKs to get install metadata for.
  repeated Value values = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message GetSDKInfosResponse {
  // The resolved install metadata, in the same order as requested.
  repeated SDKInfo sdk_infos = 1 [(buf.validate.field).repeated.min_items = 1];
}
