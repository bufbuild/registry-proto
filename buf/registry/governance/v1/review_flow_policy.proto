syntax = "proto3";

package buf.registry.governance.v1;

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/governance/v1";

// The policy controlling the review flow.
//
// When both the BreakingChangePolicy and the review flow are enabled, Commits that
// introduce breaking changes are held in a pending state until an administrator reviews
// them.
message ReviewFlowPolicy {
  // Whether the review flow is enabled.
  bool enabled = 1;
}
