syntax = "proto3";

package buf.registry.webhook.v1;

import "buf/registry/webhook/v1/event.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/webhook/v1";

// EventService is implemented by Webhook receivers, not by the BSR.
//
// The BSR calls HandleEvent using the Connect protocol with JSON encoding. If the
// Webhook's url ends in "/buf.registry.webhook.v1.EventService/HandleEvent", it is
// called as is. Otherwise that suffix is appended to the url.
//
// If the Webhook has a signing secret, each delivery has a Buf-Signature-256 header set
// to "sha256=" followed by the lowercase hex HMAC-SHA256 of the request body. Receivers
// should verify the signature against the raw body before decoding it. Receivers may
// also reject requests whose send_time is older than a maximum age they choose. This
// stops a captured delivery from being replayed, and limits how long a receiver needs to
// store Event ids for deduplication.
//
// Receivers that do not use Connect must respond to a successful delivery with status
// 200, Content-Type: application/json, and the body "{}". Any other response is a
// failure.
//
// Receivers must respond within 10 seconds, or the delivery is treated as failed. Failed
// deliveries are retried for a limited time and then dropped. An Event may be delivered
// more than once and out of order. Use the Event id to deduplicate.
//
// New fields are added to Event payloads over time. Receivers that decode the request
// body themselves should be configured to discard unknown fields to stay forward
// compatible. Connect handlers do this by default.
service EventService {
  // HandleEvent handles a single Event.
  //
  // A successful response acknowledges the Event. An error causes the Event to be
  // retried.
  rpc HandleEvent(HandleEventRequest) returns (HandleEventResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message HandleEventRequest {
  // The Event being delivered.
  Event event = 1 [(buf.validate.field).required = true];
  // The time this delivery was sent.
  //
  // Changes on each retry, unlike the Event's event_time.
  google.protobuf.Timestamp send_time = 2 [(buf.validate.field).required = true];
}

message HandleEventResponse {}
