syntax = "proto3";

package buf.registry.iam.v1;

import "buf/registry/iam/v1/principal.proto";
import "buf/registry/iam/v1/sso_subject.proto";
import "buf/validate/validate.proto";

// Operate on SSO Subjects.
service SSOSubjectService {
  // Get SSO Subjects.
  rpc GetSSOSubjects(GetSSOSubjectsRequest) returns (GetSSOSubjectsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // List all SSO Subjects for a Principal.
  rpc ListSSOSubjects(ListSSOSubjectsRequest) returns (ListSSOSubjectsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message GetSSOSubjectsRequest {
  // The references of the SSO Subjects to get.
  repeated SSOSubjectRef sso_subject_refs = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message GetSSOSubjectsResponse {
  // The retrieved SSO Subjects in the same order as requested.
  repeated SSOSubject sso_subjects = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message ListSSOSubjectsRequest {
  // The list order.
  enum Order {
    ORDER_UNSPECIFIED = 0;
    // Order by create_time newest to oldest.
    ORDER_CREATE_TIME_DESC = 1;
    // Order by create_time oldest to newest.
    ORDER_CREATE_TIME_ASC = 2;
  }
  // The maximum number of SSO Subjects to return.
  //
  // The default value is 10.
  uint32 page_size = 1 [(buf.validate.field).uint32.lte = 250];
  // The page to start from.
  //
  // If empty, the first page is returned.
  string page_token = 2 [(buf.validate.field).string.max_len = 4096];
  // The order to return the SSO Subjects.
  //
  // If not specified, defaults to ORDER_CREATE_TIME_DESC.
  Order order = 3 [(buf.validate.field).enum.defined_only = true];
  // The Principal whose SSO Subjects to list. If empty list SSO Subjects for all Principals.
  PrincipalRef principal_ref = 4 [(buf.validate.field).required = true];
}

message ListSSOSubjectsResponse {
  // The next page token.
  //
  // If empty, there are no more pages.
  string next_page_token = 1 [(buf.validate.field).string.max_len = 4096];
  // The list of SSO Subjects.
  repeated SSOSubject sso_subjects = 2;
}
