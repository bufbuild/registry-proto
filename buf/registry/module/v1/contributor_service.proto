syntax = "proto3";

package buf.registry.module.v1;

import "buf/registry/module/v1/contributor.proto";
import "buf/registry/module/v1/module.proto";
import "buf/registry/owner/v1/user.proto";
import "buf/validate/validate.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/module/v1";

// Operate on the Contributors of a Module.
//
// A Contributor is a User granted an explicit ResourceRole on a Module. This service manages
// only roles with source RESOURCE_ROLE_SOURCE_DIRECT. Roles inherited from the owning
// Organization, or granted via an identity provider group or configuration, are not managed
// here.
service ContributorService {
  // List the Contributors of a Module.
  rpc ListContributors(ListContributorsRequest) returns (ListContributorsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Grant explicit roles to Users on Modules.
  //
  // It is an error to grant a role to a User that already has an explicit role on the
  // Module; use UpdateContributors to change an existing role.
  //
  // This operation is atomic. Either all Contributors are created or an error is returned.
  rpc CreateContributors(CreateContributorsRequest) returns (CreateContributorsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Update the explicit roles of existing Contributors on Modules.
  //
  // It is an error to update a User that does not already have an explicit role on the
  // Module; use CreateContributors to grant an initial role.
  //
  // This operation is atomic. Either all Contributors are updated or an error is returned.
  rpc UpdateContributors(UpdateContributorsRequest) returns (UpdateContributorsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Revoke the explicit roles of Contributors on Modules.
  //
  // This removes the explicit role only. A User may retain access to the Module through a
  // role inherited from the owning Organization.
  //
  // This operation is atomic. Either all Contributors are deleted or an error is returned.
  rpc DeleteContributors(DeleteContributorsRequest) returns (DeleteContributorsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message ListContributorsRequest {
  // The list order.
  enum Order {
    ORDER_UNSPECIFIED = 0;
    // Order by create_time newest to oldest.
    ORDER_CREATE_TIME_DESC = 1;
    // Order by create_time oldest to newest.
    ORDER_CREATE_TIME_ASC = 2;
  }
  // The maximum number of items to return.
  //
  // The default value is 10.
  uint32 page_size = 1 [(buf.validate.field).uint32.lte = 250];
  // The page to start from.
  //
  // If empty, the first page is returned.
  string page_token = 2 [(buf.validate.field).string.max_len = 4096];
  // The Module to list Contributors for.
  ModuleRef module_ref = 3 [(buf.validate.field).required = true];
  // The order to return the Contributors.
  //
  // If not specified, defaults to ORDER_CREATE_TIME_DESC.
  Order order = 4 [(buf.validate.field).enum.defined_only = true];
}

message ListContributorsResponse {
  // The next page token.
  //
  // If empty, there are no more pages.
  string next_page_token = 1 [(buf.validate.field).string.max_len = 4096];
  // The listed Contributors.
  repeated Contributor contributors = 2;
}

message CreateContributorsRequest {
  // An individual request to grant a role to a User on a Module.
  message Value {
    // The Module to grant the role on.
    ModuleRef module_ref = 1 [(buf.validate.field).required = true];
    // The User to grant the role to.
    buf.registry.owner.v1.UserRef user_ref = 2 [(buf.validate.field).required = true];
    // The role to grant.
    //
    // This may not be lower than any role the User already inherits from the owning
    // Organization.
    ResourceRole role = 3 [
      (buf.validate.field).required = true,
      (buf.validate.field).enum.defined_only = true,
      (buf.validate.field).enum.not_in = 0
    ];
  }
  // The Contributors to create.
  repeated Value values = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message CreateContributorsResponse {
  // The created Contributors in the same order as given on the request.
  repeated Contributor contributors = 1 [(buf.validate.field).repeated.min_items = 1];
}

message UpdateContributorsRequest {
  // An individual request to update the role of a Contributor on a Module.
  message Value {
    // The Module the Contributor has a role on.
    ModuleRef module_ref = 1 [(buf.validate.field).required = true];
    // The User whose role is being updated.
    buf.registry.owner.v1.UserRef user_ref = 2 [(buf.validate.field).required = true];
    // The new role to assign.
    //
    // This may not be lower than any role the User already inherits from the owning
    // Organization.
    ResourceRole role = 3 [
      (buf.validate.field).required = true,
      (buf.validate.field).enum.defined_only = true,
      (buf.validate.field).enum.not_in = 0
    ];
  }
  // The Contributors to update.
  repeated Value values = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message UpdateContributorsResponse {
  // The updated Contributors in the same order as given on the request.
  repeated Contributor contributors = 1 [(buf.validate.field).repeated.min_items = 1];
}

message DeleteContributorsRequest {
  // An individual request to revoke a User's explicit role on a Module.
  message Value {
    // The Module to revoke the role on.
    ModuleRef module_ref = 1 [(buf.validate.field).required = true];
    // The User whose explicit role is being revoked.
    buf.registry.owner.v1.UserRef user_ref = 2 [(buf.validate.field).required = true];
  }
  // The Contributors to delete.
  repeated Value values = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message DeleteContributorsResponse {}
