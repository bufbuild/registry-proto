syntax = "proto3";

package buf.registry.webhook.v1;

import "buf/registry/module/v1/commit.proto";
import "buf/registry/module/v1/label.proto";
import "buf/registry/module/v1/module.proto";
import "buf/registry/webhook/v1/webhook.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/webhook/v1";

// An Event delivered to a Webhook.
//
// An Event is delivered as the body of an HTTP POST request to the Webhook's url. If the
// Webhook has a signing secret, the delivery is signed with an HMAC over the request body,
// sent in a request header. Delivery is at-least-once: a delivery may be retried, and
// every delivery of the same Event carries the same id, which receivers can use to
// deduplicate.
message Event {
  // The id of the Event.
  //
  // The id is unique for an Event occurrence and is reused for every delivery and retry
  // of that occurrence.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.tuuid = true
  ];
  // The type of the Event.
  EventType type = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
  // The time the Event occurred.
  google.protobuf.Timestamp event_time = 3 [(buf.validate.field).required = true];
  // The payload of the Event, matching its type.
  oneof payload {
    option (buf.validate.oneof).required = true;
    // The payload for EVENT_TYPE_MODULE_COMMIT_PUSHED.
    ModuleCommitPushedPayload module_commit_pushed = 4;
    // The payload for EVENT_TYPE_MODULE_LABEL_MOVED.
    ModuleLabelMovedPayload module_label_moved = 5;
    // The payload for EVENT_TYPE_MODULE_DELETED.
    ModuleDeletedPayload module_deleted = 6;
  }
}

// The payload of an Event of type EVENT_TYPE_MODULE_COMMIT_PUSHED.
message ModuleCommitPushedPayload {
  // The Module that the Commit was pushed to.
  buf.registry.module.v1.Module module = 1 [(buf.validate.field).required = true];
  // The Commit that was pushed.
  buf.registry.module.v1.Commit commit = 2 [(buf.validate.field).required = true];
}

// The payload of an Event of type EVENT_TYPE_MODULE_LABEL_MOVED.
message ModuleLabelMovedPayload {
  // The Module that the Label belongs to.
  buf.registry.module.v1.Module module = 1 [(buf.validate.field).required = true];
  // The Label after it was created or moved, including the Commit it now points to.
  buf.registry.module.v1.Label label = 2 [(buf.validate.field).required = true];
  // The id of the Commit that the Label pointed to before it was moved.
  //
  // This is empty if the Label was created rather than moved.
  string from_commit_id = 3 [
    (buf.validate.field).string.tuuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

// The payload of an Event of type EVENT_TYPE_MODULE_DELETED.
message ModuleDeletedPayload {
  // The Module that was deleted, as it was at the time of deletion.
  buf.registry.module.v1.Module module = 1 [(buf.validate.field).required = true];
}
