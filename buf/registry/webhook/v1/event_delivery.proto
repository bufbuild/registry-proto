syntax = "proto3";

package buf.registry.webhook.v1;

import "buf/registry/priv/extension/v1beta1/extension.proto";
import "buf/registry/webhook/v1/webhook.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/webhook/v1";

// The delivery of an Event to a Webhook.
//
// Each Event, other than a ping, has exactly one EventDelivery, with 0 or more delivery
// attempts.
//
// EventDeliveries are deleted after the retention period configured for the BSR instance.
message EventDelivery {
  option (buf.registry.priv.extension.v1beta1.message).response_only = true;
  option (buf.validate.message).cel = {
    id: "event_delivery.failed_has_reason"
    message: "last_failure_reason is required when state is EVENT_DELIVERY_STATE_FAILED"
    // EVENT_DELIVERY_STATE_FAILED is 3.
    expression: "this.state != 3 || this.last_failure_reason != 0"
  };

  // The id of the Event sent to the receiver.
  string event_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.tuuid = true
  ];
  // The id of the Webhook the Event is sent to.
  string webhook_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.tuuid = true
  ];
  // The type of the Event.
  EventType event_type = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.not_in = 0,
    (buf.validate.field).enum.not_in = 1
  ];
  // The time the Event occurred.
  google.protobuf.Timestamp event_time = 4 [(buf.validate.field).required = true];
  // The state of the delivery.
  EventDeliveryState state = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
  // The number of times the Event has been sent.
  uint32 attempt_count = 6;
  // The time of the last attempt.
  //
  // Unset if there have been no attempts.
  google.protobuf.Timestamp last_attempt_time = 7;
  // The HTTP status of the receiver's response to the last attempt.
  //
  // Unset if the receiver did not respond.
  optional uint32 last_http_status_code = 8 [
    (buf.validate.field).uint32.gte = 100,
    (buf.validate.field).uint32.lte = 599
  ];
  // The reason the last attempt failed.
  //
  // Unset if there have been no attempts or the last attempt succeeded.
  EventDeliveryFailureReason last_failure_reason = 9 [(buf.validate.field).enum.defined_only = true];
}

// The state of an EventDelivery.
enum EventDeliveryState {
  EVENT_DELIVERY_STATE_UNSPECIFIED = 0;
  // The Event has not been acknowledged yet and will be resent (or sent for the first time).
  EVENT_DELIVERY_STATE_PENDING = 1;
  // The receiver acknowledged the Event.
  EVENT_DELIVERY_STATE_SUCCEEDED = 2;
  // Every attempt failed. The Event will not be sent again unless redelivered.
  EVENT_DELIVERY_STATE_FAILED = 3;
}

// The reason an attempt to send an Event failed.
enum EventDeliveryFailureReason {
  EVENT_DELIVERY_FAILURE_REASON_UNSPECIFIED = 0;
  // The receiver responded with an HTTP status other than 200.
  EVENT_DELIVERY_FAILURE_REASON_HTTP_ERROR = 1;
  // The receiver responded with HTTP status 200 but an invalid Content-Type or body.
  EVENT_DELIVERY_FAILURE_REASON_INVALID_ACKNOWLEDGEMENT = 2;
  // The receiver did not respond in time.
  EVENT_DELIVERY_FAILURE_REASON_TIMEOUT = 3;
  // The receiver could not be reached.
  EVENT_DELIVERY_FAILURE_REASON_CONNECTION_ERROR = 4;
  // The BSR could not send the Event.
  EVENT_DELIVERY_FAILURE_REASON_INTERNAL_ERROR = 5;
}
