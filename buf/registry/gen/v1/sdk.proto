syntax = "proto3";

package buf.registry.gen.v1;

import "buf/registry/priv/extension/v1beta1/extension.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/gen/v1";

// An SDK is a hosted, versioned package produced by generating a Module with a generation Plugin
// and publishing the result to a language package registry (for example, the Go module proxy or
// the npm registry).
//
// The SDKRegistry identifies which package registry an SDK is published to. A generation Plugin
// produces SDKs for exactly one registry.
enum SDKRegistry {
  SDK_REGISTRY_UNSPECIFIED = 0;
  // The Go module proxy.
  SDK_REGISTRY_GO = 1;
  // The npm registry.
  SDK_REGISTRY_NPM = 2;
  // A Maven repository.
  SDK_REGISTRY_MAVEN = 3;
  // The Swift package registry.
  SDK_REGISTRY_SWIFT = 4;
  // A Python package index.
  SDK_REGISTRY_PYTHON = 5;
  // The Cargo registry (crates).
  SDK_REGISTRY_CARGO = 6;
  // A NuGet feed.
  SDK_REGISTRY_NUGET = 7;
  // A CMake registry.
  SDK_REGISTRY_CMAKE = 8;
}

// SDKInfo is the resolved install metadata for an SDK: a specific Module reference generated by a
// specific generation Plugin, published to a specific package registry.
//
// SDKInfo is everything a client needs to depend on a generated SDK without reading source: the
// registry it lives in, the resolved version string, the registry-specific package name, and the
// exact Module Commit and Plugin build it was resolved from.
message SDKInfo {
  option (buf.registry.priv.extension.v1beta1.message).response_only = true;

  // The resolved Module Commit that the SDK was generated from.
  message Module {
    // The id of the Module.
    string id = 1 [
      (buf.validate.field).required = true,
      (buf.validate.field).string.tuuid = true
    ];
    // The name of the Organization that owns the Module.
    //
    // This is the name as resolved at the time of the request; it can change if the owner is
    // renamed. The id is the durable identifier.
    string owner = 2 [(buf.validate.field).required = true];
    // The name of the Module.
    //
    // This is the name as resolved at the time of the request; it can change if the Module is
    // renamed. The id is the durable identifier.
    string name = 3 [(buf.validate.field).required = true];
    // The id of the resolved Commit.
    string commit_id = 4 [
      (buf.validate.field).required = true,
      (buf.validate.field).string.tuuid = true
    ];
    // The time the resolved Commit was pushed to the BSR.
    google.protobuf.Timestamp commit_create_time = 5 [(buf.validate.field).required = true];
  }

  // The resolved generation Plugin build that produced the SDK.
  message Plugin {
    // The id of the Plugin.
    string id = 1 [
      (buf.validate.field).required = true,
      (buf.validate.field).string.tuuid = true
    ];
    // The name of the Organization that owns the Plugin.
    string owner = 2 [(buf.validate.field).required = true];
    // The name of the Plugin.
    string name = 3 [(buf.validate.field).required = true];
    // The resolved semver version of the Plugin, for example "v1.2.0".
    string version = 4 [(buf.validate.field).required = true];
    // The resolved revision of the Plugin version.
    uint32 revision = 5;
  }

  // The package registry that the SDK is published to.
  SDKRegistry registry = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  // The resolved SDK version string.
  //
  // The format is determined by the SDKRegistry. For example, a Go SDK version looks like
  // "v1.2.0-20240101000000-abcdef123456" while an npm SDK version omits the leading "v".
  string version = 2 [(buf.validate.field).required = true];
  // The registry-specific package name (or coordinates) used to install the SDK.
  //
  // The meaning is determined by the SDKRegistry. For example:
  //   - SDK_REGISTRY_GO: the Go module path.
  //   - SDK_REGISTRY_NPM: the npm package name.
  //   - SDK_REGISTRY_MAVEN: the "groupId:artifactId" coordinates.
  //   - SDK_REGISTRY_PYTHON: the distribution name.
  //
  // This may be empty. For most registries the package name is derived deterministically from the
  // Module and Plugin. For some registries, however, it is assigned and stored by the BSR the first
  // time the SDK is generated (for example, a Python distribution name, which may carry a
  // server-added suffix to guarantee uniqueness). Because this RPC has no side effects, a name that
  // has not yet been assigned is reported as empty rather than being allocated on read.
  optional string package_name = 3;
  // The resolved Module Commit that the SDK was generated from.
  Module module = 4 [(buf.validate.field).required = true];
  // The resolved generation Plugin build that produced the SDK.
  Plugin plugin = 5 [(buf.validate.field).required = true];
}
