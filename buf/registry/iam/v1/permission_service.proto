syntax = "proto3";

package buf.registry.iam.v1;

import "buf/registry/iam/v1/permission.proto";
import "buf/registry/iam/v1/validate.proto";
import "buf/validate/validate.proto";

// Operate on Permissions.
service PermissionService {
  // Get Permissions by name.
  rpc GetPermissions(GetPermissionsRequest) returns (GetPermissionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // List all Permissions.
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message GetPermissionsRequest {
  // The names of the Permissions to retrieve.
  repeated string names = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250,
    (buf.validate.field).repeated.items.string.(permission_name) = true
  ];
}

message GetPermissionsResponse {
  // The retrieved Permissions in the same order as requested.
  repeated Permission permissions = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message ListPermissionsRequest {
  // The maximum number of Permissions to return.
  //
  // The default value is 10.
  uint32 page_size = 1 [(buf.validate.field).uint32.lte = 250];
  // The page to start from.
  //
  // If empty, the first page is returned.
  string page_token = 2 [(buf.validate.field).string.max_len = 4096];
  // Filter Permissions by name.
  //
  // If set, only Permissions whose name contains this string are returned.
  string name_query = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.max_len = 255
  ];
}

message ListPermissionsResponse {
  // The next page token.
  //
  // If empty, there are no more pages.
  string next_page_token = 1 [(buf.validate.field).string.max_len = 4096];
  // The list of Permissions in alphabetical order by name.
  repeated Permission permissions = 2;
}
