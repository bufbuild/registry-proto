syntax = "proto3";

package buf.registry.schema.v1;

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/schema/v1";

// A serialization format for a Protobuf message.
enum Format {
  FORMAT_UNSPECIFIED = 0;
  // The Protobuf binary wire format.
  FORMAT_BINARY = 1;
  // The Protobuf JSON format.
  FORMAT_JSON = 2;
}
