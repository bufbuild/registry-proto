syntax = "proto3";

package buf.registry.iam.v1;

import "buf/registry/priv/extension/v1beta1/extension.proto";
import "buf/registry/priv/validate/v1beta1/validate.proto";
import "buf/validate/validate.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/iam/v1";

// A Role on the BSR.
//
// A Role is a named bundle of Permissions that can be granted to a User. A User's effective
// Permissions are the union of the Permissions granted by all of the User's Roles, which may then
// be further restricted on a Token via ScopedPermissions.
message Role {
  option (buf.registry.priv.extension.v1beta1.message).response_only = true;

  // The id of the Role.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.tuuid = true
  ];
  // The name of the Role.
  //
  // A name uniquely identifies a Role within the BSR instance.
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(buf.registry.priv.validate.v1beta1.role_name) = true
  ];
  // A human-readable description of what the Role allows.
  string description = 3 [(buf.validate.field).string.max_len = 512];
  // The Permissions granted by this Role.
  //
  // Each entry is either a Permission name (e.g. "bsr.module.delete") or
  // a wildcard pattern ending in ".*" that matches all Permissions sharing a
  // prefix (e.g. "bsr.module.*").
  repeated string permissions = 4 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250,
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items.string.(buf.registry.priv.validate.v1beta1.permission_pattern) = true
  ];
}

// RoleRef is a reference to a Role, either an id or a name.
//
// This is used in requests.
message RoleRef {
  option (buf.registry.priv.extension.v1beta1.message).request_only = true;

  oneof value {
    option (buf.validate.oneof).required = true;
    // The id of the Role.
    string id = 1 [(buf.validate.field).string.tuuid = true];
    // The name of the Role.
    //
    // A Role name is unique within the BSR instance.
    string name = 2 [(buf.validate.field).string.(buf.registry.priv.validate.v1beta1.role_name) = true];
  }
}
