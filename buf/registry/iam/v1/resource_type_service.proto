syntax = "proto3";

package buf.registry.iam.v1;

import "buf/registry/iam/v1/resource_type.proto";
import "buf/registry/iam/v1/validate.proto";
import "buf/validate/validate.proto";

// Read ResourceTypes.
service ResourceTypeService {
  // Get ResourceTypes by name.
  rpc GetResourceTypes(GetResourceTypesRequest) returns (GetResourceTypesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // List all ResourceTypes.
  rpc ListResourceTypes(ListResourceTypesRequest) returns (ListResourceTypesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message GetResourceTypesRequest {
  // The names of the ResourceTypes to retrieve.
  repeated string names = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250,
    (buf.validate.field).repeated.items.string.(resource_type_name) = true
  ];
}

message GetResourceTypesResponse {
  // The retrieved ResourceTypes in the same order as requested.
  repeated ResourceType resource_types = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message ListResourceTypesRequest {
  // The list order.
  enum Order {
    ORDER_UNSPECIFIED = 0;
    // Order by create_time newest to oldest.
    ORDER_CREATE_TIME_DESC = 1;
    // Order by create_time oldest to newest.
    ORDER_CREATE_TIME_ASC = 2;
  }
  // The maximum number of ResourceTypes to return.
  //
  // The default value is 10.
  uint32 page_size = 1 [(buf.validate.field).uint32.lte = 250];
  // The page to start from.
  //
  // If empty, the first page is returned.
  string page_token = 2 [(buf.validate.field).string.max_len = 4096];
  // The order to return the ResourceTypes.
  //
  // If not specified, defaults to ORDER_CREATE_TIME_DESC.
  Order order = 3 [(buf.validate.field).enum.defined_only = true];
  // Filter ResourceTypes by name.
  //
  // If set, only ResourceTypes whose name contains this string are returned.
  string name_query = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.max_len = 255
  ];
}

message ListResourceTypesResponse {
  // The next page token.
  //
  // If empty, there are no more pages.
  string next_page_token = 1 [(buf.validate.field).string.max_len = 4096];
  // The list of ResourceTypes.
  repeated ResourceType resource_types = 2;
}
