syntax = "proto3";

package buf.registry.gen.v1;

import "buf/registry/plugin/v1/plugin.proto";
import "buf/registry/priv/extension/v1beta1/extension.proto";
import "buf/validate/validate.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/gen/v1";

// GenerationPluginRef selects a specific build of a generation Plugin to execute: a PluginRef plus
// an optional version/revision pin.
//
//   - version unset: the latest version is used.
//   - version set, revision unset: the latest revision of that version is used.
//   - both set: that exact build is used.
message GenerationPluginRef {
  option (buf.registry.priv.extension.v1beta1.message).request_only = true;
  option (buf.validate.message).cel = {
    id: "generation_plugin_ref.revision_requires_version"
    message: "revision cannot be set without a version"
    expression: "!has(this.revision) || has(this.version)"
  };

  // The Plugin to execute.
  buf.registry.plugin.v1.PluginRef plugin_ref = 1 [(buf.validate.field).required = true];
  // The semver version to use, for example "v1.2.0". If unset, the latest version is used.
  optional string version = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 250
  }];
  // The build revision, starting at 1. If unset, the latest revision is used. Requires a version.
  optional uint32 revision = 3 [(buf.validate.field).uint32.gte = 1];
}
