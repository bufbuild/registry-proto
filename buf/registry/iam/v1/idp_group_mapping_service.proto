syntax = "proto3";

package buf.registry.iam.v1;

import "buf/registry/iam/v1/idp_group_mapping.proto";
import "buf/registry/module/v1/module.proto";
import "buf/registry/module/v1/module_contributor.proto";
import "buf/registry/owner/v1/organization.proto";
import "buf/registry/owner/v1/organization_membership.proto";
import "buf/registry/priv/extension/v1beta1/extension.proto";
import "buf/registry/priv/validate/v1beta1/validate.proto";
import "buf/validate/validate.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/iam/v1";

// Operate on IdP group mappings.
//
// A single service manages mappings on all resource types. Each mapping is on an Organization or a
// Module, identified in requests by an IdpGroupMappingRef.
service IdpGroupMappingService {
  // List IdP group mappings.
  //
  // Mappings on Organizations and Modules are returned together.
  rpc ListIdpGroupMappings(ListIdpGroupMappingsRequest) returns (ListIdpGroupMappingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (buf.registry.priv.extension.v1beta1.method).required_permission = "bsr.idp-group-mapping.list";
  }
  // Create new IdP group mappings.
  //
  // It is an error to create a mapping for a resource and IdP group name that already has a
  // mapping.
  //
  // This operation is atomic. Either all mappings are created or an error is returned.
  rpc CreateIdpGroupMappings(CreateIdpGroupMappingsRequest) returns (CreateIdpGroupMappingsResponse) {
    option idempotency_level = IDEMPOTENT;
    option (buf.registry.priv.extension.v1beta1.method).required_permission = "bsr.idp-group-mapping.create";
  }
  // Update existing IdP group mappings.
  //
  // Only the role may be updated. To change the resource or IdP group name, delete the mapping and
  // create a new one.
  //
  // This operation is atomic. Either all mappings are updated or an error is returned.
  rpc UpdateIdpGroupMappings(UpdateIdpGroupMappingsRequest) returns (UpdateIdpGroupMappingsResponse) {
    option idempotency_level = IDEMPOTENT;
    option (buf.registry.priv.extension.v1beta1.method).required_permission = "bsr.idp-group-mapping.update";
  }
  // Delete existing IdP group mappings.
  //
  // This operation is atomic. Either all mappings are deleted or an error is returned.
  rpc DeleteIdpGroupMappings(DeleteIdpGroupMappingsRequest) returns (DeleteIdpGroupMappingsResponse) {
    option idempotency_level = IDEMPOTENT;
    option (buf.registry.priv.extension.v1beta1.method).required_permission = "bsr.idp-group-mapping.delete";
  }
}

message ListIdpGroupMappingsRequest {
  // The list order.
  enum Order {
    ORDER_UNSPECIFIED = 0;
    // Order by create_time newest to oldest.
    ORDER_CREATE_TIME_DESC = 1;
    // Order by create_time oldest to newest.
    ORDER_CREATE_TIME_ASC = 2;
  }
  // The maximum number of items to return.
  //
  // The default value is 10.
  uint32 page_size = 1 [(buf.validate.field).uint32.lte = 250];
  // The page to start from.
  //
  // If empty, the first page is returned.
  string page_token = 2 [(buf.validate.field).string.max_len = 4096];
  // The Organization to filter mappings by.
  //
  // If set, only mappings on the Organization and on the Modules it owns are returned. If unset,
  // mappings across the entire instance are returned, subject to the caller's permissions.
  buf.registry.owner.v1.OrganizationRef organization_ref = 3;
  // The order to return the mappings.
  //
  // If not specified, defaults to ORDER_CREATE_TIME_DESC.
  Order order = 4 [(buf.validate.field).enum.defined_only = true];
}

message ListIdpGroupMappingsResponse {
  // The next page token.
  //
  // If empty, there are no more pages.
  string next_page_token = 1 [(buf.validate.field).string.max_len = 4096];
  // The list of mappings.
  repeated IdpGroupMapping idp_group_mappings = 2;
}

message CreateIdpGroupMappingsRequest {
  // An individual request to create an IdP group mapping.
  message Value {
    // A mapping to create on an Organization.
    message Organization {
      // The Organization to create the mapping on.
      buf.registry.owner.v1.OrganizationRef organization_ref = 1 [(buf.validate.field).required = true];
      // The role mapped Users receive within the Organization.
      buf.registry.owner.v1.OrganizationRole role = 2 [
        (buf.validate.field).required = true,
        (buf.validate.field).enum.defined_only = true,
        (buf.validate.field).enum.not_in = 0
      ];
    }
    // A mapping to create on a Module.
    message Module {
      // The Module to create the mapping on.
      buf.registry.module.v1.ModuleRef module_ref = 1 [(buf.validate.field).required = true];
      // The role override.
      //
      // If set, mapped Users receive this role. If unset, mapped Users receive the owning
      // Organization's base Module role.
      optional buf.registry.module.v1.ModuleContributorRole role_override = 2 [
        (buf.validate.field).enum.defined_only = true,
        (buf.validate.field).enum.not_in = 0
      ];
    }
    // The name of the IdP group, as it appears in the identity provider.
    string group_name = 1 [
      (buf.validate.field).required = true,
      (buf.validate.field).string.(buf.registry.priv.validate.v1beta1.idp_group_name) = true
    ];
    // The resource to create the mapping on.
    oneof target {
      option (buf.validate.oneof).required = true;
      // Create the mapping on an Organization.
      Organization organization = 2;
      // Create the mapping on a Module.
      Module module = 3;
    }
  }
  // The mappings to create.
  repeated Value values = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message CreateIdpGroupMappingsResponse {
  // The created mappings in the same order as given on the request.
  repeated IdpGroupMapping idp_group_mappings = 1 [(buf.validate.field).repeated.min_items = 1];
}

message UpdateIdpGroupMappingsRequest {
  // An individual request to update an IdP group mapping.
  //
  // The mapping is identified by its resource and IdP group name. For Organizations, the role
  // replaces the mapping's current role. For Modules, the role override replaces the mapping's
  // current override; if unset, the override is removed and mapped Users receive the Module's
  // default role.
  message Value {
    // The mapping to update on an Organization.
    message Organization {
      // The Organization that the mapping applies to.
      buf.registry.owner.v1.OrganizationRef organization_ref = 1 [(buf.validate.field).required = true];
      // The role mapped Users receive within the Organization.
      buf.registry.owner.v1.OrganizationRole role = 2 [
        (buf.validate.field).required = true,
        (buf.validate.field).enum.defined_only = true,
        (buf.validate.field).enum.not_in = 0
      ];
    }
    // The mapping to update on a Module.
    message Module {
      // The Module that the mapping applies to.
      buf.registry.module.v1.ModuleRef module_ref = 1 [(buf.validate.field).required = true];
      // The role override.
      //
      // If set, mapped Users receive this role. If unset, mapped Users receive the owning
      // Organization's base Module role.
      optional buf.registry.module.v1.ModuleContributorRole role_override = 2 [
        (buf.validate.field).enum.defined_only = true,
        (buf.validate.field).enum.not_in = 0
      ];
    }
    // The name of the IdP group, as it appears in the identity provider.
    string group_name = 1 [
      (buf.validate.field).required = true,
      (buf.validate.field).string.(buf.registry.priv.validate.v1beta1.idp_group_name) = true
    ];
    // The resource the mapping applies to.
    oneof target {
      option (buf.validate.oneof).required = true;
      // The mapping is on an Organization.
      Organization organization = 2;
      // The mapping is on a Module.
      Module module = 3;
    }
  }
  // The mappings to update.
  repeated Value values = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message UpdateIdpGroupMappingsResponse {
  // The updated mappings in the same order as given on the request.
  repeated IdpGroupMapping idp_group_mappings = 1 [(buf.validate.field).repeated.min_items = 1];
}

message DeleteIdpGroupMappingsRequest {
  // The mappings to delete.
  repeated IdpGroupMappingRef idp_group_mapping_refs = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message DeleteIdpGroupMappingsResponse {}
