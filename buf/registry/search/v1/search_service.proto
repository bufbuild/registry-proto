syntax = "proto3";

package buf.registry.search.v1;

import "buf/registry/priv/extension/v1beta1/extension.proto";
import "buf/registry/search/v1/search_request.proto";
import "buf/registry/search/v1/search_result.proto";
import "buf/validate/validate.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/search/v1";

// Search the BSR.
service SearchService {
  rpc Search(SearchRequest) returns (SearchResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (buf.registry.priv.extension.v1beta1.method).required_permission = "bsr.search";
  }
}

enum OrderBy {
  ORDER_BY_UNSPECIFIED = 0;
  ORDER_BY_CREATE_TIME = 1;
  ORDER_BY_UPDATE_TIME = 2;
  ORDER_BY_NAME = 3;
  ORDER_BY_RELEVANCE = 4;
}

message SearchRequest {
  // The search query. This consists of search terms against the name field for the entity.
  // Filters are specified in fields in the per-entity filters
  string query = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 256
  ];
  // The maximum number of items to return. The page size applies across all entities;
  // the maximum total returned values is page_size, not page_size * number of entity filters
  //
  // The default value is 10.
  uint32 page_size = 2 [(buf.validate.field).uint32.lte = 250];
  // The page to start from.
  //
  // If empty, the first page is returned.
  string page_token = 3 [(buf.validate.field).string.max_len = 4096];

  // Sort order for results
  //
  // If unspecified, use SORT_ORDER_RELEVANCE
  optional OrderBy order_by = 4 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];

  // if not specified or false, sort ascending
  bool descending = 5;

  // The kind of entities to return and any associated search filters.
  // If none are specified, no search results are returned.
  // If you want results for an entity type, even if no filter values are used,
  // you must include an empty filter.
  optional UserFilter user_filter = 6;
  optional OrgFilter org_filter = 7;
  optional ModuleFilter module_filter = 8;
  optional PluginFilter plugin_filter = 9;
  optional ElementFilter element_filter = 10;
  optional FileFilter file_filter = 11;
  optional TeamFilter team_filter = 12;
}

message SearchResponse {
  // The next page token.
  //
  // If empty, there are no more pages in any entity type
  // The token is opaque and contains offset and done information for each entity type in the search request
  string next_page_token = 1 [(buf.validate.field).string.max_len = 4096];
  // The search results. for each Entity Filter in the request, there will be a corresponding search result, even
  // if there are no remaining results for that type.
  UserResults user_results = 2;
  OrgResults org_results = 3;
  ModuleResults module_results = 4;
  PluginResults plugin_results = 5;
  ElementResults element_results = 6;
  FileResults file_results = 7;
  TeamResults team_results = 8;
}

message UserResults {
  repeated UserResult results = 1;
}

message OrgResults {
  repeated OrgResult results = 1;
}

message ModuleResults {
  repeated ModuleResult results = 1;
}

message PluginResults {
  repeated PluginResult results = 1;
}

message ElementResults {
  repeated ElementResult results = 1;
}

message FileResults {
  repeated FileResult results = 1;
}

message TeamResults {
  repeated TeamResult results = 1;
}
