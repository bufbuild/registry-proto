syntax = "proto3";

package buf.registry.gen.v1;

import "buf/registry/gen/v1/file.proto";
import "buf/registry/module/v1/resource.proto";
import "buf/registry/plugin/v1/plugin.proto";
import "buf/validate/validate.proto";
import "google/protobuf/descriptor.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/gen/v1";

// Generate code from Protobuf schemas using remote generation Plugins.
service GenerationService {
  // Generate code for a set of Protobuf schemas using the specified generation Plugins.
  //
  // GenerateCode is a synchronous, bounded, pure function of its inputs: given the same schema and
  // the same resolved Plugin builds, it returns the same output. It does not create or mutate any
  // BSR state, and is therefore annotated as having no side effects.
  //
  // The returned files are final and standalone. The BSR is the generation driver: it runs each
  // Plugin and resolves any insertion points server-side, so a client can write the returned files
  // to disk as-is, with no protoc-style post-processing required.
  rpc GenerateCode(GenerateCodeRequest) returns (GenerateCodeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message GenerateCodeRequest {
  // An individual generation request for a single Plugin.
  message PluginGeneration {
    // The Plugin to execute.
    buf.registry.plugin.v1.GenerationPluginRef plugin_ref = 1 [(buf.validate.field).required = true];
    // The options to pass to the Plugin.
    //
    // These are merged into a single, comma-separated parameter string when invoking the Plugin.
    repeated string options = 2;
    // Whether to generate code for imports for this Plugin.
    //
    // If unset, the top-level include_imports value on the request is used.
    optional bool include_imports = 3;
    // Whether to generate code for the Well-Known Types for this Plugin.
    //
    // include_imports must be true if include_well_known_types is true.
    //
    // If unset, the top-level include_well_known_types value on the request is used.
    optional bool include_well_known_types = 4;
  }

  // A self-contained schema supplied directly in the request.
  message SchemaInput {
    // A single compiled file in the schema, tagged with whether it is an import.
    message SchemaFile {
      // The compiled file descriptor.
      google.protobuf.FileDescriptorProto descriptor = 1 [(buf.validate.field).required = true];
      // Whether this file is an import.
      //
      // An import is a file that is present only so the schema resolves - a dependency or a
      // Well-Known Type - rather than a primary file to generate. Imports are generated only if
      // include_imports (or, for Well-Known Types, include_well_known_types) is set.
      //
      // Files with is_import set to false are primaries and are always generated.
      bool is_import = 2;
    }
    // The compiled files of the schema.
    //
    // This must be self-contained: it must include every imported file needed to resolve the
    // primary files, including transitive imports and any Well-Known Types that are used. Each
    // such file must be present and marked with is_import set to true.
    repeated SchemaFile files = 1 [(buf.validate.field).repeated.min_items = 1];
  }

  // The schema to generate code from.
  oneof input {
    option (buf.validate.oneof).required = true;
    // A reference to a Module, Label, or Commit to generate code from.
    //
    // See the documentation on ResourceRef for resource resolution details. The compiled schema
    // for the resolved Commit is used as the generation input, and the BSR determines which files
    // are imports from the Module's dependency graph.
    buf.registry.module.v1.ResourceRef module_ref = 1;
    // A self-contained schema supplied directly in the request.
    //
    // Use this to generate from a local schema that is not, or not yet, on the BSR. The caller is
    // responsible for compiling the schema and marking which files are imports via
    // SchemaInput.SchemaFile.is_import.
    SchemaInput schema = 2;
  }
  // The Plugins to run against the input.
  //
  // Each Plugin produces a corresponding entry in the response, in the same order.
  repeated PluginGeneration plugins = 3 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
  // Whether to generate code for imports from the input.
  //
  // For a module_ref input, imports are the Module's dependencies. For a schema input, imports are
  // the files marked with is_import. May be overridden per Plugin via
  // PluginGeneration.include_imports.
  bool include_imports = 4;
  // Whether to generate code for the Well-Known Types from the input.
  //
  // include_imports must be true if include_well_known_types is true. May be overridden per Plugin
  // via PluginGeneration.include_well_known_types.
  bool include_well_known_types = 5;
}

message GenerateCodeResponse {
  // The output of a single Plugin execution.
  message Output {
    // The files generated by the Plugin.
    //
    // Empty if the Plugin failed (see error) or produced no output for the given input.
    repeated File files = 1;
    // An error message if this Plugin failed to generate code.
    //
    // This reports a Plugin-level failure that is isolated to this Plugin - for example, invalid
    // options or a Plugin that exited with an error. The other Plugins in the request are
    // unaffected, and their outputs are still returned in their corresponding positions. If set,
    // files is empty. Empty on success.
    //
    // Failures that affect the entire request - such as an input schema that does not compile, an
    // unresolvable module_ref, or a malformed file_descriptor_set - are returned as RPC errors
    // rather than here, since no Plugin can run.
    string error = 2;
  }
  // The outputs of each Plugin, in the same order as the plugins in the request.
  repeated Output outputs = 1 [(buf.validate.field).repeated.min_items = 1];
}
