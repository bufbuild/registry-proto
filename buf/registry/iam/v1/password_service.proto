syntax = "proto3";

package buf.registry.iam.v1;

import "buf/registry/iam/v1/password.proto";
import "buf/registry/iam/v1/principal.proto";
import "buf/validate/validate.proto";

// Operate on Passwords.
service PasswordService {
  // Get Passwords.
  rpc GetPasswords(GetPasswordsRequest) returns (GetPasswordsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // List Passwords.
  rpc ListPasswords(ListPasswordsRequest) returns (ListPasswordsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Create new Passwords for Principals.
  //
  // This operation is atomic. Either all Passwords are created or an error is returned.
  rpc CreatePasswords(CreatePasswordsRequest) returns (CreatePasswordsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Update Passwords.
  //
  // This operation is atomic. Either all Passwords are updated or an error is returned.
  rpc UpdatePasswords(UpdatePasswordsRequest) returns (UpdatePasswordsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Delete Passwords by ID.
  //
  // This operation is atomic. Either all Passwords are deleted or an error is returned.
  rpc DeletePasswords(DeletePasswordsRequest) returns (DeletePasswordsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message GetPasswordsRequest {
  // The references of the Passwords to get.
  repeated PasswordRef password_refs = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message GetPasswordsResponse {
  // The retrieved Passwords in the same order as requested.
  repeated Password passwords = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message ListPasswordsRequest {
  // The list order.
  enum Order {
    ORDER_UNSPECIFIED = 0;
    // Order by create_time newest to oldest.
    ORDER_CREATE_TIME_DESC = 1;
    // Order by create_time oldest to newest.
    ORDER_CREATE_TIME_ASC = 2;
  }
  // The maximum number of Passwords to return.
  //
  // The default value is 10.
  uint32 page_size = 1 [(buf.validate.field).uint32.lte = 250];
  // The page to start from.
  //
  // If empty, the first page is returned.
  string page_token = 2 [(buf.validate.field).string.max_len = 4096];
  // The order to return the Passwords.
  //
  // If not specified, defaults to ORDER_CREATE_TIME_DESC.
  Order order = 3 [(buf.validate.field).enum.defined_only = true];
  // The Principal whose Passwords to list.
  //
  // If not specified, Passwords for all Principals are returned.
  PrincipalRef principal_ref = 4;
  // Only return Passwords of these states.
  //
  // If empty, Passwords of all states are returned.
  repeated PasswordState states = 5 [
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items.enum.defined_only = true,
    (buf.validate.field).repeated.items.enum.not_in = 0
  ];
}

message ListPasswordsResponse {
  // The next page token.
  //
  // If empty, there are no more pages.
  string next_page_token = 1 [(buf.validate.field).string.max_len = 4096];
  // The list of Passwords.
  repeated Password passwords = 2;
}

message CreatePasswordsRequest {
  // An individual request to create a Password.
  message Value {
    // The Principal for which to create the Password.
    PrincipalRef principal_ref = 1 [(buf.validate.field).required = true];
    // The raw password.
    //
    // This cannot be retrieved again later.
    string raw_password = 2 [
      (buf.validate.field).required = true,
      (buf.validate.field).string.min_len = 8,
      (buf.validate.field).string.max_len = 4096
    ];
  }
  // The Passwords to create.
  repeated Value values = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message CreatePasswordsResponse {
  // The created Passwords in the same order as requested.
  repeated Password passwords = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message UpdatePasswordsRequest {
  // An individual request to update a Password.
  message Value {
    option (buf.validate.message).cel = {
      id: "update_password.raw_password_requires_state"
      message: "state is required when raw_password is provided"
      expression: "this.raw_password == '' || has(this.state)"
    };
    option (buf.validate.message).cel = {
      id: "update_password.reset_requires_raw_password"
      message: "raw_password is required when transitioning to PASSWORD_STATE_RESET"
      expression: "!has(this.state) || this.state != 2 || this.raw_password != ''"
    };
    // The reference of the Password to update.
    PasswordRef password_ref = 1 [(buf.validate.field).required = true];
    // The new raw password.
    //
    // If not empty, replaces the existing password. This cannot be retrieved again later.
    string raw_password = 2 [
      (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
      (buf.validate.field).string.min_len = 8,
      (buf.validate.field).string.max_len = 4096
    ];
    // The new state of the Password. Required if raw password is set.
    //
    // If not set, the state is not updated. Only valid transitions are:
    //  - PASSWORD_STATE_LOCKED to PASSWORD_STATE_ACTIVE (unlock)
    //  - PASSWORD_STATE_ACTIVE to PASSWORD_STATE_RESET (admin reset with a temp password)
    //  - PASSWORD_STATE_RESET to PASSWORD_STATE_ACTIVE (user login after admin reset)
    //
    // It is an error to transition into or out of PASSWORD_STATE_RESET without providing a new raw
    // password.
    optional PasswordState state = 3 [
      (buf.validate.field).enum.defined_only = true,
      (buf.validate.field).enum.not_in = 0
    ];
  }
  // The Passwords to update.
  repeated Value values = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message UpdatePasswordsResponse {
  // The updated Passwords in the same order as requested.
  repeated Password passwords = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message DeletePasswordsRequest {
  // The references of the Passwords to delete.
  repeated PasswordRef password_refs = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 250
  ];
}

message DeletePasswordsResponse {}
